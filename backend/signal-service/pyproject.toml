[project]
name = "inspection-signal-service"
version = "0.1.0"
description = "Local authenticated telemetry receiver for the Inspection platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
protocols = ["paho-mqtt>=2.1,<3", "pymodbus[serial]>=3.11,<4", "asyncua>=1.1,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<3", "bandit>=1.8,<2", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
