services:
  - type: web
    name: beinong-app-api
    runtime: docker
    dockerfilePath: ./backend/node-api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_ALLOWED_ORIGINS
        value: https://jnfakimo.github.io

