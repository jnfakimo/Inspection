name: Market daily import

on:
  schedule:
    - cron: '0 4 * * *' # 臺灣時間每日中午 12:00（GitHub 排程可能延遲）
  workflow_dispatch:
    inputs:
      date:
        description: '結束日期 YYYY-MM-DD；留空使用臺灣今天，回補最近三日'
        type: string
        required: false
      dry_run:
        description: '僅試讀驗證，不寫入資料庫'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: market-daily-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安裝行情解析工具
        run: python -m pip install -r tools/market-import-requirements.txt
      - name: 驗證解析、去重與匯入保護
        run: python -m unittest discover -s tools -p 'test_market_daily_import.py'
      - name: 抓取並匯入北農全場交易行情
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REQUESTED_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "$REQUESTED_DATE" ]; then args+=(--date "$REQUESTED_DATE"); fi
          if [ "$DRY_RUN" != 'true' ]; then args+=(--execute); fi
          python tools/market_daily_import.py "${args[@]}"
