name: No-JavaScript synthetic probe

on:
  schedule:
    # 低頻、固定來源的唯讀探針；不開瀏覽器、不執行頁面 JavaScript。
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout probe
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Probe GitHub Pages, REST and Storage
        env:
          SYNTHETIC_PAGES_URL: https://jnfakimo.github.io/Inspection/
          SUPABASE_PROJECT_REF: qztffronusdhgxhjjub
          SUPABASE_URL: https://qztffronusdhgxhjjub.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNTHETIC_PROBE_WINDOW_MINUTES: 15
          SYNTHETIC_PROBE_TIMEOUT_MS: 15000
          SYNTHETIC_PROBE_LATENCY_WARNING_MS: 3000
          SYNTHETIC_PROBE_LATENCY_CRITICAL_MS: 10000
          SYNTHETIC_EDGE_TRAFFIC_THRESHOLD: 300
          SYNTHETIC_STORAGE_TRAFFIC_THRESHOLD: 100
          SYNTHETIC_PROBE_ALERT_FUNCTION_URL: https://qztffronusdhgxhjjub.supabase.co/functions/v1/platform-log-alert
        run: node tools/synthetic-probe.mjs
