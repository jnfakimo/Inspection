name: Commercial readiness checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit static application
        run: node tools/commercial-readiness-audit.mjs
      - name: Audit V2 security design controls
        run: npm run security:audit
      - name: Audit production dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=moderate
