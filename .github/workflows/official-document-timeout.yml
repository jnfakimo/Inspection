name: Official document timeout notification

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-document-timeout
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger official document timeout check
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ANON_KEY"
          test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 45 \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"scheduled":true}' \
            https://qztffronusdhgxhjjubt.supabase.co/functions/v1/official-document-timeout-check
