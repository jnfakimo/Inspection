name: Market history backfill

# 北農全場交易行情的歷史回補：從官網逐日抓取指定期間，每 7 天一個交易寫入雲端
# tapmc_market_actual（與每日排程同一來源、同一穩定鍵，重跑不會重複計量）。
# 只能手動觸發；長期間請分段（例如一次 2～3 年），單次上限 6 小時。
# 逐品名代號（含品種）的原始列會另存為 artifact，日後若改成代碼粒度可直接載入。

on:
  workflow_dispatch:
    inputs:
      from:
        description: '起日 YYYY-MM-DD'
        type: string
        required: true
      to:
        description: '迄日 YYYY-MM-DD（含）'
        type: string
        required: true
      dry_run:
        description: '僅試讀驗證，不寫入資料庫'
        type: boolean
        default: false

permissions:
  contents: read

# 與每日排程分開排隊；資料庫內另有 advisory lock 讓兩者的交易互相等待。
concurrency:
  group: market-backfill-import
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安裝行情解析工具
        run: python -m pip install -r tools/market-import-requirements.txt
      - name: 驗證解析、去重與匯入保護
        run: python -m unittest discover -s tools -p 'test_market_daily_import.py'
      - name: 逐日抓取並分批匯入
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RANGE_FROM: ${{ inputs.from }}
          RANGE_TO: ${{ inputs.to }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RANGE_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo '::error::起日格式錯誤'; exit 1; }
          [[ "$RANGE_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo '::error::迄日格式錯誤'; exit 1; }
          args=(--from "$RANGE_FROM" --date "$RANGE_TO" --raw-output "raw-rows/${RANGE_FROM}_${RANGE_TO}")
          if [ "$DRY_RUN" != 'true' ]; then args+=(--execute); fi
          python tools/market_daily_import.py "${args[@]}"
      - name: 保存逐代碼原始列
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-raw-rows-${{ inputs.from }}-${{ inputs.to }}
          path: raw-rows
          if-no-files-found: ignore
          retention-days: 90
