name: Hardened Pages deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned build tools
        run: npm ci

      - name: Build restricted and minified site artifact
        run: npm run build:pages
        env:
          PROVENANCE_PRIVATE_KEY: ${{ secrets.PROVENANCE_PRIVATE_KEY }}
          NEXT_PUBLIC_APP_API_URL: ${{ vars.NEXT_PUBLIC_APP_API_URL }}

      - name: Verify signed provenance manifest
        run: npm run verify:provenance

      - name: Scan every website page
        run: npm run scan:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload restricted Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy restricted artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan every deployed website page
        run: node tools/scan-all-pages.mjs "${{ needs.deploy.outputs.page_url }}"
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
