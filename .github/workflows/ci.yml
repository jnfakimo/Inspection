name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # 臺灣時間每日 05:00（UTC 21:00）自動執行 CI 檢查
    - cron: '0 0 * * 0' # weekly run for dependency checks

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --show-error --silent --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          sudo install --mode 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan complete Git history for secrets
        run: gitleaks git . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --no-banner

      - name: Scan current source tree for secrets
        run: npm run security:gitleaks

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==1.177.0"

      - name: Scan maintained application sources with Semgrep
        run: npm run security:semgrep

  gmail-repair-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Verify Gmail repair with Linux file permissions
        run: python3 tools/gmail-repair.test.py
      - name: Verify security scan failures cannot pass
        run: python3 tools/security-audit-runner.test.py
      - name: Verify deployment security gate
        run: node --test tools/deployment-security-gate.test.mjs

  iis-powershell-compatibility:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify IIS deployment under Windows PowerShell 5.1
        run: node tools/iis-sync-compatibility-check.mjs
      - name: Verify scoped WSL repair backups and rollback
        run: python tools/wsl-edge-repair-check.py
      - name: Verify read-only cutover collector and secret redaction
        run: python tools/local-cutover-check.test.py
      - name: Verify scoped Gmail repair and rollback
        run: python tools/gmail-repair.test.py
      - name: Verify FindTag visible-data probe with synthetic data only
        run: python tools/findtag-visible-probe.test.py
      - name: Verify FindTag sync DPAPI and offline queue with synthetic data only
        run: python tools/findtag-sync.test.py
      - name: Parse cutover collector with Windows PowerShell 5.1
        shell: powershell
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/inspect-local-cutover.ps1'), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'Cutover collector PowerShell syntax failed.' }

  signal-service-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/signal-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.25
      - name: Install locked service and test dependencies
        run: uv sync --locked --group dev
      - name: Test signal service
        run: uv run --locked --no-sync pytest -q
      - name: Verify certificate trust store baseline
        run: uv run --no-sync python -c "import certifi; assert tuple(map(int, certifi.__version__.split('.'))) >= (2026, 10, 19)"
      - name: Audit locked production dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/signal-runtime-requirements.txt"
          uv run --no-sync pip-audit --disable-pip --no-deps --require-hashes -r "$RUNNER_TEMP/signal-runtime-requirements.txt"

  mobile-vehicle-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/vehicle-tracker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/vehicle-tracker/package-lock.json
      - name: Install locked mobile dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck mobile application
        run: npm run typecheck
      - name: Verify encrypted mobile storage and retention
        run: npm run test:storage
      - name: Verify mobile dependency tree
        run: npm ls compression shell-quote source-map-js uuid
      - name: Bundle Android and iOS with synthetic configuration
        run: |
          npx --no-install expo export --platform android --output-dir dist-smoke/android --max-workers 2
          npx --no-install expo export --platform ios --output-dir dist-smoke/ios --max-workers 2
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_SUPABASE_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: offline-synthetic-placeholder

  build:
    name: Application tests and API build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Install any npm dependencies if package.json exists
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; else echo "No package.json, skipping npm install"; fi

      # Run unit / integration tests if defined
      - name: Run tests
        run: |
          npm test

      - name: Verify cutover SQL with isolated PostgreSQL engine
        run: node tools/local-cutover-sql-check.mjs
      - name: Verify protected FindTag sync database with synthetic data only
        run: node tools/findtag-sync-schema.test.mjs

      - name: Build Node.js API
        run: npm run typecheck:api && npm run build:api

      # Lint HTML files using htmlhint
      # supabase/templates/** 是 Supabase Auth 的信件範本，不是網站頁面——它們是
      # 刻意不帶 doctype 的片段（主控台會把內容包進信件本體），套網頁規則只會拿到
      # 六個 doctype-first 假警報。
      - name: Lint HTML with htmlhint
        run: |
          npx htmlhint "**/*.html" --ignore "google620de73073c56d88.html,supabase/templates/**"

      # Validate HTML semantics using html-validate
      - name: Validate HTML semantics
        run: |
          # 只驗證本專案的 38 個正式網站頁面，避免把 npm 套件內附的範例 HTML
          # 誤判成本站頁面（例如 node_modules/terser/tools/props.html）。
          npx -y html-validate "index.html" "system/*.html"

      # Lint CSS files using stylelint
      - name: Lint CSS with stylelint
        run: |
          npx stylelint "system/*.css" --allow-empty-input

      # Lint JavaScript files using ESLint
      - name: Lint JavaScript with ESLint
        run: |
          npx eslint . --ext .js,.html || true

      # login.html contains the production authentication flow as inline JS.
      # Compile every inline script so a missing brace cannot reach GitHub Pages.
      - name: Validate login JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('system/login.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline login script found');
          scripts.forEach((match, index) => new vm.Script(match[1], { filename: `system/login.html:inline-${index + 1}` }));
          console.log(`Validated ${scripts.length} inline login script(s)`);
          NODE

      # Check for broken links and images
      - name: Check broken links and images
        run: |
          npx -y broken-link-checker . || true

      # Verify Subresource Integrity hashes (optional helper)
      - name: Verify SRI hashes
        run: |
          # Simple check: ensure script tags with external src contain integrity attribute
          grep -R "<script src=\"https://" -n . | grep -v "integrity" && echo "Missing integrity detected" || echo "All external scripts have integrity attributes"
        shell: bash

      - name: Scan public pages for server secrets
        run: npm run security:secrets

      # Dependency freshness check
      - name: Check outdated npm dependencies
        run: |
          npm outdated || echo "Dependencies are up‑to‑date"
        continue-on-error: true
