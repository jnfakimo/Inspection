<style>
:root{--bg:#020b18;--panel:#041428;--border:#0a3a5a;--cyan:#00d4ff;--cyan2:#00a8cc;--text:#b0d8f0;--text2:#5a8ab0}
:root[data-theme="light"]{--bg:#f4f6fa;--panel:#ffffff;--border:#c3d4e3;--cyan:#0284c7;--cyan2:#0369a1;--text:#1e293b;--text2:#64748b}
/* light mode overrides */
:root[data-theme="light"] #topbar{background:rgba(255,255,255,.97)}
:root[data-theme="light"] #osd{background:#f8fafc;color:#1e293b}
:root[data-theme="light"] #floors select{background:#f8fafc;border-color:#cbd5e1;color:#1e293b}
:root[data-theme="light"] #floors option{background:#ffffff;color:#1e293b}
:root[data-theme="light"] .tbtn{background:#f1f5f9;border-color:#e2e8f0;color:#1e293b}
:root[data-theme="light"] .tbtn:hover{background:#e2e8f0}
:root[data-theme="light"] #hud{background:rgba(255,255,255,.92);border-color:#e2e8f0;color:#1e293b}
:root[data-theme="light"] #hint{background:rgba(255,255,255,.92);border-color:#e2e8f0;color:#1e293b}
:root[data-theme="light"] #mkToggle{background:#f1f5f9;border-color:#e2e8f0;color:#1e293b}
:root[data-theme="light"] #mkpanel{background:rgba(255,255,255,.95);border-color:#e2e8f0;color:#1e293b}
:root[data-theme="light"] #osd,:root[data-theme="light"] #osdNav{background:#fff!important}
:root[data-theme="light"] #osd canvas,:root[data-theme="light"] #osdNav canvas{filter:grayscale(1) brightness(.55) contrast(1000%)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI','Noto Sans TC',sans-serif;overflow:hidden}

#topbar{position:fixed;top:0;left:0;right:0;height:50px;background:rgba(2,11,24,.97);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:200;overflow-x:auto;overflow-y:hidden}
.tb-logo{font-size:13px;font-weight:700;color:var(--cyan);white-space:nowrap}
.tb-sep{width:1px;height:24px;background:var(--border)}
.tb-title{font-size:11px;color:var(--text2);white-space:nowrap;flex:0 0 auto}
.tb-space{flex:1 0 auto}
.tb-back{color:var(--text2);text-decoration:none;display:inline-flex;align-items:center;padding:4px 10px;border:1px solid var(--border);border-radius:3px;font-size:11px;transition:all .2s;white-space:nowrap;flex:0 0 auto}
.tb-back:hover{border-color:var(--cyan);color:var(--cyan)}

#osd{position:fixed;inset:50px 0 0 0;background:#04101f;touch-action:none}
.embed-mode #topbar{display:none}
.embed-mode #osd{inset:0}
.embed-mode #floors,.embed-mode #mkToggle,.embed-mode #mkpanel{transform:translateY(-50px)}
.patrol-only #mkpanel [data-marker-kind]:not([data-marker-kind="patrol"]){display:none}

/* Floor switch (right) — 樓層下拉式選單 */
#floors{position:fixed;right:14px;top:62px;z-index:150}
#floors select{background:rgba(4,20,40,.98);color:var(--cyan);border:1px solid var(--border);border-radius:6px;padding:10px 30px 10px 14px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;outline:none;min-width:150px;box-shadow:0 0 18px rgba(0,212,255,.12);
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--cyan) 50%),linear-gradient(135deg,var(--cyan) 50%,transparent 50%);
  background-position:calc(100% - 16px) center,calc(100% - 11px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
#floors select:hover,#floors select:focus{border-color:var(--cyan)}
#floors option{background:#04101f;color:var(--text)}

/* Tool dock */
#tools{position:fixed;right:14px;top:210px;display:flex;flex-direction:column;gap:6px;z-index:150}
.tbtn{width:40px;height:40px;background:rgba(4,20,40,.95);border:1px solid var(--border);color:var(--cyan2);border-radius:5px;cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none}
.tbtn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,.1)}
.tbtn:active{background:rgba(0,212,255,.22)}

/* Bottom-right row: mouse-control hint + HUD, side by side (hint on the left, HUD on the right) */
#bottomRightRow{position:fixed;right:14px;bottom:14px;z-index:150;display:flex;align-items:flex-end;gap:8px}
#hud{background:rgba(4,20,40,.92);border:1px solid var(--border);border-radius:6px;padding:9px 13px;font-size:11px;line-height:1.7;min-width:160px}
#hud .h-t{color:var(--cyan);font-weight:700;font-size:12px;margin-bottom:3px}
#hud .h-r{color:var(--text2)}
#hud .h-r span{color:var(--text)}

#hint{background:rgba(4,20,40,.92);border:1px solid var(--border);border-radius:6px;padding:9px 13px;font-size:10px;color:var(--text2);text-align:right;line-height:1.8;pointer-events:none;white-space:nowrap}

/* Navigator (mini-map) — bottom-left, enlarged 1.3x to match the marker-system page */
#osdNav{position:fixed!important;top:auto!important;right:auto!important;left:14px!important;bottom:14px!important;width:169px!important;height:130px!important;z-index:150}

#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:12px}
.ld-t{font-size:13px;color:var(--cyan);letter-spacing:.1em}
.ld-bar{width:200px;height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.ld-fill{height:100%;background:var(--cyan);width:0%;transition:width .25s}
.ld-m{font-size:11px;color:var(--text2)}

/* 整合標記（唯讀顯示，與整合標記系統 / 3D 同步）*/
.pin{position:relative;transform:translate(-50%,-50%);pointer-events:auto;cursor:default}
.pin .pdot{width:8px;height:8px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:1px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.6);margin:0 auto}
.pin .plab{position:absolute;left:50%;top:-3px;transform:translate(-50%,-100%);background:#000;border:1px solid rgba(255,255,255,.42);color:#fff;font-size:12px!important;font-weight:600;line-height:1.35;padding:3px 7px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 2px 7px rgba(0,0,0,.48)}
.pin:hover .plab,.pin.show-lab .plab{opacity:1}
#mkToggle{position:fixed;left:14px;top:62px;z-index:151;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(4,20,40,.95);border:1px solid var(--border);border-radius:5px;color:var(--cyan);font-size:12px;font-weight:700;box-shadow:0 0 18px rgba(0,212,255,.12);cursor:pointer}
#mkToggle:hover{border-color:var(--cyan)}
#mkpanel{position:fixed;left:14px;top:62px;z-index:152;background:rgba(4,20,40,.95);border:1px solid var(--border);border-radius:6px;padding:11px 13px;font-size:11px;line-height:1.9;min-width:165px;max-width:min(280px,calc(100vw - 28px));max-height:calc(100vh - 76px);overflow-y:auto;display:none;box-shadow:0 0 22px rgba(0,212,255,.12)}
#mkpanel .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px}
#mkpanel .p-t{color:var(--cyan);font-weight:700;font-size:12px}
#mkpanel .panel-close{display:inline-flex;background:none;border:1px solid var(--border);color:var(--text2);border-radius:3px;padding:3px 8px;font-size:10px;cursor:pointer}
#mkpanel .panel-close:hover{border-color:var(--cyan);color:var(--cyan)}
#mkpanel .panel-close.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,.12)}
#mkpanel label{color:var(--text2);display:flex;align-items:center;gap:7px;cursor:pointer}
#mkpanel label span{text-shadow:0 0 3px rgba(255,255,255,.6)}
#mkpanel input{accent-color:var(--cyan)}

@media(max-width:600px){ .tb-title{display:none} .tbtn{width:42px;height:42px;font-size:17px} #floors select{min-width:120px;font-size:12px} #mkpanel,#mkToggle{font-size:11px} #bottomRightRow,#osdNav{display:none!important} #tools{right:10px;top:164px;gap:8px} }

</div>

<div id="topbar">
  <div class="tb-logo">臺北農產公司 第一果菜市場</div>
  <div class="tb-sep"></div>
  <div class="tb-title" id="tbTitle">樓層平面圖</div>

<!-- 標記顯示選單（左側，預設隱藏，與 3D 立體樓層一致）-->

  <div class="panel-head">

      <button class="panel-close" id="mkPinBtn" onclick="toggleMkPin()" title="釘住後點空白處不會自動收合">📌 釘住</button>

</div>

<div id="bottomRightRow">
  <div id="hint">拖曳 平移 &nbsp;|&nbsp; 滾輪 局部縮放 &nbsp;|&nbsp; ↺<span class="ic ic-refresh"></span> 旋轉 &nbsp;|&nbsp; 樓層上下對位</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js" integrity="sha384-4BsIv4BUV37POdA1NZ6UcVAsFk96MQXmFLog7pWs+JP+a8k2XjilfManEVdWDxTe" crossorigin="anonymous"></script>
<script src="vendor/supabase-js-2.min.js"></script>
<script src="supabase-config.js?v=20260806-1"></script>
<script src="patrolstatus.js"></script>
<script>
const db = createDb();
// 巡邏點打卡即時反映：不必等 30 秒輪詢，有新打卡就馬上重繪
db.channel('checkin_logs_realtime_plan')
  .on('postgres_changes',{event:'*',schema:'public',table:'checkin_logs'},()=>refreshPatrolStatus())
  .subscribe();
const PAGE_PARAMS=new URLSearchParams(location.search);
const MODEL_VERSION=PAGE_PARAMS.get('modelv')||'';
const PATROL_ONLY=PAGE_PARAMS.get('patrol')==='1';
(async()=>{const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';}})();
function versionedModelUrl(url){
  if(!MODEL_VERSION||!url) return url;
  const join=url.includes('?')?'&':'?';
  return `${url}${join}modelv=${encodeURIComponent(MODEL_VERSION)}`;
}
function prog(p,m){document.getElementById('ldfill').style.width=p+'%';document.getElementById('ldmsg').textContent=m;}
prog(15,'建立檢視器…');

// B1/1F/2F/3F are rendered on the SAME world frame & pixel grid → perfectly aligned/stackable.
const viewer = OpenSeadragon({
  id:'osd', prefixUrl:'',
  showNavigationControl:false,
  showNavigator:true, navigatorId:'osdNav', navigatorPosition:'BOTTOM_LEFT', navigatorHeight:130, navigatorWidth:169,
  navigatorAutoFade:false, navigatorBackground:'#041428', navigatorBorderColor:'#0a3a5a', navigatorDisplayRegionColor:'#00d4ff',
  backgroundColor:'#04101f', degrees:0, minZoomLevel:0.2, maxZoomPixelRatio:4, zoomPerScroll:1.3,
  animationTime:0.5, springStiffness:7,
  // ── free panning (drag to move; no edge constraints so the plan can be moved freely) ──
  panHorizontal:true, panVertical:true, constrainDuringPan:false, visibilityRatio:0, flickEnabled:true, flickMomentum:0.4,
  gestureSettingsMouse:{ clickToZoom:false, dblClickToZoom:true, dragToPan:true }, gestureSettingsTouch:{ pinchRotate:true, dragToPan:true }
});

let rot=0, curFloor='B1';
// all four floors share the same world frame & pixel grid (aligned)
const FLOORS=[
  {id:'B1', label:'B1 地下一層', file:'b1', src:null},
  {id:'1F', label:'1F 一樓',     file:'f1', src:null},
  {id:'2F', label:'2F 二樓',     file:'f2', src:null},
  {id:'3F', label:'3F 三樓',     file:'f3', src:null},
];

// floor_id like "4F"/"B2" -> sort key, consistent with the display order
// above (3F,2F,1F,B1 top-to-bottom, i.e. descending)
function floorLevelOf(id){
  let m=/^B(\d+)$/i.exec(id);
  if(m) return -(parseInt(m[1],10)-1);
  m=/^(\d+)F$/i.exec(id);
  if(m) return parseInt(m[1],10);
  return 100;
}
function renderFloorSelect(){
  const sel=document.getElementById('floorSel');
  if(!sel) return;
  const sorted=[...FLOORS].sort((a,b)=>floorLevelOf(b.id)-floorLevelOf(a.id));
  sel.innerHTML=sorted.map(fl=>
    `<option value="${fl.id}"${fl.id===curFloor?' selected':''}>${fl.label}</option>`
  ).join('');
}

// Apply theme-specific background color to OpenSeadragon dynamically
function applyTheme() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const color = isLight ? '#ffffff' : '#04101f';
  if (viewer) {
    if (viewer.canvas) viewer.canvas.style.backgroundColor = color;
    if (viewer.container) viewer.container.style.backgroundColor = color;
    const nav = document.getElementById('osdNav');
    if (nav) nav.style.backgroundColor = color;
  }
}

// Watch theme changes dynamically
new MutationObserver(() => applyTheme())
  .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// Keep an embedded plan synchronized when the parent page changes theme.
window.addEventListener('storage', event => {
  if(event.key !== 'siteTheme') return;
  document.documentElement.setAttribute('data-theme', event.newValue || 'tech');
  applyTheme();
});

// use updated models from Storage if available; else the high-performance local PNG files
async function buildSources(){
  const mobileModel=matchMedia('(max-width: 768px), (pointer: coarse)').matches;

  // Always compute the known-good static fallback first, so a broken custom
  // model (deleted/renamed Storage file) can be recovered from automatically.
  FLOORS.forEach(fl=>{
    const dir=mobileModel?'plans/tex/mobile/':'plans/tex/';
    fl.fallbackSrc = { type: 'image', url: versionedModelUrl(dir + fl.file + '_tex.png') };
  });

  try{
    const {data,error}=await db.from('floor_models').select('*');
    if(error) console.warn('floor_models query failed, using static plans only',error);
    if(!mobileModel&&data&&data.length){
      data.forEach(async m => {
        if (!m.image_path) return;
        const { data: signed, error: signErr } = await db.storage.from('floorplans').createSignedUrl(m.image_path, 3600);
        if (signErr) {
          console.warn('Failed to create signed URL for', m.image_path, signErr);
          return;
        }
        const url = signed.signedURL;
        const fl = FLOORS.find(f => f.id === m.floor_id);
        if (fl) {
          fl.src = { type: 'image', url };
        } else {
          FLOORS.push({ id: m.floor_id, label: m.name || m.floor_id, file: null, src: { type: 'image', url }, fallbackSrc: null });
        }
      });
    }
  }catch(e){}

  FLOORS.forEach(fl=>{ if(!fl.src) fl.src=fl.fallbackSrc; });
  renderFloorSelect();

  showFloor('B1');
  loadPlanMarkers();
  setInterval(refreshPatrolStatus,30000);
}

// OpenSeadragon event handlers
viewer.addHandler('open', () => {
  prog(100,'完成');
  setTimeout(()=>{ const l=document.getElementById('loading'); l.style.transition='opacity .4s'; l.style.opacity='0'; setTimeout(()=>l.style.display='none',400); },150);
  applyTheme();
  resetMarkerOverlayAttachments();
  drawPlanMarkers();
});

viewer.addHandler('open-failed', () => {
  // A custom Storage model can go stale (renamed/deleted); fall back to the
  // known-good static texture instead of leaving the viewer stuck on failure.
  const cur=FLOORS.find(fl=>fl.id===curFloor);
  if(cur&&cur.fallbackSrc&&cur.src!==cur.fallbackSrc){
    cur.src=cur.fallbackSrc;
    viewer.open(cur.src);
    return;
  }
  prog(100,'載入失敗');
  setTimeout(()=>{ const l=document.getElementById('loading'); l.style.display='none'; },1000);
});

buildSources();

function showFloor(f){
  curFloor=f;
  const sel=document.getElementById('floorSel'); if(sel && sel.value!==f) sel.value=f;
  const cur=FLOORS.find(fl=>fl.id===f);
  document.getElementById('hudFloor').textContent=cur.label;
  document.getElementById('tbTitle').textContent=cur.label+' 平面圖';
  
  prog(50,'載入圖面中…');
  const l=document.getElementById('loading');
  l.style.display='flex';
  l.style.opacity='1';
  
  viewer.open(cur.src);
}

// ── 整合標記（唯讀，與整合標記系統 / 3D 同步）──────────────
const MK_COL={equipment:'#00d4ff',space:'#00ff9d',patrol:'#c77dff',repair:'#ff5470',note:'#ffb300'};
const KV=PATROL_ONLY
  ? {equipment:false,space:false,patrol:true,repair:false,note:false}
  : {equipment:true,space:true,patrol:true,repair:true,note:true};
let planMarkers=[], showLab=false;
let markerOverlayCache=new Map();
let markerRenderQueued=false;
function escB(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let patrolStatusMap=new Map();
async function loadPlanMarkers(){
  try{
    let query=db.from('plan_markers').select('marker_id,floor_id,x,y,kind,label').eq('status','active');
    if(PATROL_ONLY) query=query.eq('kind','patrol');
    const {data,error}=await query;
    if(!error) planMarkers=data||[];
  }catch(e){}
  drawPlanMarkers();
  refreshPatrolStatus();
}
async function refreshPatrolStatus(){
  try{ const r=await PatrolStatus.compute(db); patrolStatusMap=r.map; }
  catch(e){ /* patrol_shifts 尚未建表時，靜默略過，圖釘維持原色 */ }
  drawPlanMarkers();
}
function markerColor(m){
  if(m.kind==='patrol') return PatrolStatus.COLORS[patrolStatusMap.get(m.marker_id)||'pending'];
  return MK_COL[m.kind]||'#ffb300';
}
// 舊版 drawPlanMarkers() 已由下方使用 requestAnimationFrame 的優化版本取代（P1-01 修正）
function drawPlanMarkers(){
  if(markerRenderQueued) return;
  markerRenderQueued=true;
  requestAnimationFrame(renderPlanMarkers);
}
function markerKey(m,i){
  return m.marker_id||`${m.floor_id}:${m.kind||'note'}:${m.x}:${m.y}:${i}`;
}
function makeMarkerOverlay(m){
  const el=document.createElement('div');
  el.className='pin';
  el.innerHTML='<div class="pdot"></div><div class="plab"></div>';
  return {el,dot:el.querySelector('.pdot'),lab:el.querySelector('.plab'),added:false,marker:m};
}
function syncMarkerOverlay(cached,m){
  cached.marker=m;
  cached.el.classList.toggle('show-lab',showLab);
  cached.dot.style.background=markerColor(m);
  cached.lab.textContent=m.label||'';
}
function resetMarkerOverlayAttachments(){
  markerOverlayCache.forEach(cached=>{
    if(cached.added){
      viewer.removeOverlay(cached.el);
      cached.added=false;
    }
  });
}
function renderPlanMarkers(){
  markerRenderQueued=false;
  if(!viewer.viewport) return;
  const activeKeys=new Set();
  let visibleCount=0;
  planMarkers.forEach((m,i)=>{
    const key=markerKey(m,i);
    const shouldShow=m.floor_id===curFloor && KV[m.kind]!==false;
    let cached=markerOverlayCache.get(key);
    if(!cached){
      cached=makeMarkerOverlay(m);
      markerOverlayCache.set(key,cached);
    }
    syncMarkerOverlay(cached,m);
    if(shouldShow){
      activeKeys.add(key);
      visibleCount++;
      if(!cached.added){
        viewer.addOverlay({
          element:cached.el,
          location:new OpenSeadragon.Point(m.x,m.y),
          placement:OpenSeadragon.Placement.CENTER,
          checkResize:false
        });
        cached.added=true;
      }
    }else if(cached.added){
      viewer.removeOverlay(cached.el);
      cached.added=false;
    }
  });
  markerOverlayCache.forEach((cached,key)=>{
    if(!activeKeys.has(key)&&cached.added){
      viewer.removeOverlay(cached.el);
      cached.added=false;
    }
  });
  const n=document.getElementById('mkNum'); if(n) n.textContent=visibleCount+' 點';
}
function toggleMkKind(k,on){ KV[k]=on; drawPlanMarkers(); }
function toggleMkLabels(on){ showLab=on; drawPlanMarkers(); }
let mkPinned=false;
function toggleMkPanel(open){
  document.getElementById('mkpanel').style.display=open?'block':'none';
  document.getElementById('mkToggle').style.display=open?'none':'inline-flex';
  if(!open){ mkPinned=false; syncMkPin(); }
}
function toggleMkPin(){ mkPinned=!mkPinned; if(mkPinned) toggleMkPanel(true); syncMkPin(); }
function syncMkPin(){ const b=document.getElementById('mkPinBtn'); if(b){ b.classList.toggle('on',mkPinned); b.textContent=mkPinned?'📌 已釘住':'📌 釘住'; } }
// 左鍵點圖面空白處 → 收合標記選單（已釘住則保留）
viewer.addHandler('canvas-click',ev=>{ if(ev.quick && !mkPinned) toggleMkPanel(false); });

function updHud(){
  if(!viewer.viewport) return;
  const z=Math.round(viewer.viewport.getZoom(true)/viewer.viewport.getHomeZoom()*100);
  document.getElementById('h-zoom').textContent=z+'%';
  document.getElementById('h-rot').textContent=(((rot%360)+360)%360)+'°';
}
function setRot(d){ rot=d; viewer.viewport.setRotation(((rot%360)+360)%360); updHud(); }

viewer.addHandler('zoom',updHud); viewer.addHandler('animation',updHud);
document.getElementById('t-zin').onclick =()=>{viewer.viewport.zoomBy(1.4);viewer.viewport.applyConstraints();};
document.getElementById('t-zout').onclick=()=>{viewer.viewport.zoomBy(0.71);viewer.viewport.applyConstraints();};
document.getElementById('t-rl').onclick  =()=>setRot(rot-15);
document.getElementById('t-rr').onclick  =()=>setRot(rot+15);
document.getElementById('t-home').onclick=()=>{viewer.viewport.goHome();setRot(0);};
document.getElementById('t-fs').onclick   =()=>viewer.setFullScreen(!viewer.isFullPage());
window.addEventListener('keydown',e=>{
  if(e.key==='+'||e.key==='='){viewer.viewport.zoomBy(1.4);viewer.viewport.applyConstraints();}
  else if(e.key==='-'){viewer.viewport.zoomBy(0.71);viewer.viewport.applyConstraints();}
  else if(e.key==='['){setRot(rot-15);} else if(e.key===']'){setRot(rot+15);}
  else if(e.key==='0'){viewer.viewport.goHome();setRot(0);}
  else if(e.key==='1'){showFloor('1F');} else if(e.key==='2'){showFloor('2F');}
  else if(e.key==='3'){showFloor('3F');} else if(e.key==='b'||e.key==='B'){showFloor('B1');}
});
</script>
