<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https: http://127.0.0.1:8091; connect-src 'self' https: wss: http://127.0.0.1:8091; worker-src 'self' blob:; frame-src 'self' blob:">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('siteTheme')||'tech');</script>
<script src="theme.js?v=20260807-audit1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系統初始化</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:40px 36px;width:100%;max-width:480px}
h1{font-size:1.3rem;font-weight:700;color:#f8fafc;margin-bottom:6px}
.sub{font-size:.83rem;color:#64748b;margin-bottom:28px}
.step{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid #1e293b}
.step:last-child{border-bottom:none}
.step-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;margin-top:1px}
.pending{background:#334155;color:#64748b}
.running{background:#1e3a5f;color:#60a5fa;animation:pulse 1s infinite}
.ok{background:#052e16;color:#22c55e}
.fail{background:#450a0a;color:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.step-text{font-size:.87rem}
.step-label{color:#e2e8f0;font-weight:500}
.step-detail{font-size:.75rem;color:#64748b;margin-top:3px}
.result{margin-top:24px;padding:16px;border-radius:12px;font-size:.88rem;display:none}
.result.ok{background:#052e16;border:1px solid #16a34a;color:#86efac;display:block}
.result.fail{background:#450a0a;border:1px solid #7f1d1d;color:#fca5a5;display:block}
.btn{display:inline-block;margin-top:16px;padding:11px 24px;background:#6366f1;color:#fff;border:none;border-radius:9px;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#4f46e5}

:root[data-theme="light"] body{background:#f4f6fa;color:#1e293b}
:root[data-theme="light"] .card{background:#ffffff;border-color:#e2e8f0;box-shadow:0 10px 30px rgba(15,23,42,.08)}
:root[data-theme="light"] h1{color:#0f172a}
:root[data-theme="light"] .sub{color:#64748b}
:root[data-theme="light"] .step{border-bottom-color:#e2e8f0}
:root[data-theme="light"] .pending{background:#e2e8f0;color:#64748b}
:root[data-theme="light"] .running{background:#dbeafe;color:#2563eb}
:root[data-theme="light"] .ok{background:#dcfce7;color:#16a34a}
:root[data-theme="light"] .fail{background:#fee2e2;color:#dc2626}
:root[data-theme="light"] .step-label{color:#1e293b}
:root[data-theme="light"] .step-detail{color:#64748b}
:root[data-theme="light"] .result.ok{background:#dcfce7;border-color:#16a34a;color:#166534}
:root[data-theme="light"] .result.fail{background:#fee2e2;border-color:#dc2626;color:#991b1b}

</style>
<link rel="stylesheet" href="light-mode-fix.css?v=20260806-1">
<link rel="stylesheet" href="mobile-unified.css?v=20260717-1">
</head>
<body>
<div class="card">
  <h1>🔧 系統初始化</h1>
  <div class="sub">正式環境已停用瀏覽器初始化，避免未授權建立管理者或基礎資料。</div>

  <div id="steps">
    <div class="step" id="s1">
      <div class="step-icon pending" id="i1">1</div>
      <div class="step-text">
        <div class="step-label">瀏覽器初始化</div>
        <div class="step-detail" id="d1">已停用</div>
      </div>
    </div>
    <div class="step" id="s2">
      <div class="step-icon pending" id="i2">2</div>
      <div class="step-text">
        <div class="step-label">資料庫建置</div>
        <div class="step-detail" id="d2">僅能由受控的 migration 流程執行</div>
      </div>
    </div>
    <div class="step" id="s3">
      <div class="step-icon pending" id="i3">3</div>
      <div class="step-text">
        <div class="step-label">管理者帳號</div>
        <div class="step-detail" id="d3">請由 Supabase Auth 與核准的管理流程建立</div>
      </div>
    </div>
    <div class="step" id="s4">
      <div class="step-icon pending" id="i4">4</div>
      <div class="step-text">
        <div class="step-label">正式資料保護</div>
        <div class="step-detail" id="d4">本頁不會寫入、清空或重設任何資料</div>
      </div>
    </div>
  </div>

  <div class="result ok" id="resultBox">✓ 安全模式已啟用。<br><a class="btn" href="login.html">返回登入 →</a></div>
</div>
</body>
</html>
