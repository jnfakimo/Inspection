*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}.card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:26px 22px;text-align:center}.icon{font-size:2.6rem;margin-bottom:10px}.icon.ok{color:var(--green);text-shadow:0 0 18px rgba(0,255,157,.5)}.icon.err{color:var(--red);text-shadow:0 0 18px rgba(255,84,112,.5)}.icon.load{color:var(--patrol);text-shadow:0 0 18px rgba(199,125,255,.5)}h1{font-family:var(--font-head);font-size:1.2rem;color:var(--text-hi);letter-spacing:.04em;margin-bottom:6px}.sub{font-size:.8rem;color:var(--text-dim);margin-bottom:18px}.detail{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:14px;text-align:left;font-size:.82rem;line-height:2;margin-bottom:18px}.detail b{color:var(--text-hi)}.detail .k{color:var(--text-dim);display:inline-block;width:86px}.btn{display:inline-block;padding:10px 20px;margin:4px;border-radius:3px;font-size:.8rem;font-family:var(--font-head);letter-spacing:.05em;border:1px solid var(--patrol);color:var(--patrol);background:rgba(199,125,255,.1);cursor:pointer;text-decoration:none}.btn:hover{background:rgba(199,125,255,.2)}.btn:disabled{opacity:.55;cursor:wait}.btn.secondary{border-color:var(--border);color:var(--text-dim);background:transparent}.mfa-box{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:16px;text-align:left}.mfa-help{font-size:.78rem;line-height:1.7;color:var(--text-dim);margin-bottom:12px}.mfa-qr{display:block;width:180px;height:180px;object-fit:contain;margin:0 auto 12px;background:#fff;border-radius:4px}.mfa-secret{font-size:.7rem;color:var(--text-dim);word-break:break-all;margin-bottom:12px}.mfa-secret code{color:var(--text-hi)}.mfa-label{display:block;font-size:.8rem;color:var(--text-dim);margin-bottom:6px}.mfa-code{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:4px;background:var(--panel);color:var(--text-hi);font-size:1.1rem;letter-spacing:.25em;text-align:center}.mfa-error{color:var(--red);font-size:.76rem;margin-top:8px;text-align:center}.hist{margin-top:20px;text-align:left}.hist-t{font-size:.72rem;color:var(--text-dim);margin-bottom:8px;letter-spacing:.04em}.hist-row{display:flex;justify-content:space-between;font-size:.76rem;color:var(--text);padding:6px 0;border-top:1px solid rgba(12,40,64,.6)}.hist-row .u{color:var(--text-dim)}.hist-empty,.hist-error{padding:12px 0;border-top:1px solid rgba(12,40,64,.6);color:var(--text-dim);font-size:.76rem;text-align:center}.hist-error{color:var(--red)}

<script>
// 舊版曾支援離線直寫；安全版 QR 簽到必須即時連線，移除舊 service worker 與快取。
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
if('caches' in window){caches.keys().then(keys=>keys.filter(k=>/^patrol-checkin-/i.test(k)).forEach(k=>caches.delete(k))).catch(()=>{});}
</script>
