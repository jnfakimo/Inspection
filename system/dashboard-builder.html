<style>
:root{--bg:#020b18;--panel:#05101e;--surface:#041428;--border:#0c2840;--border-hi:#1a4a70;--cyan:#00d4ff;--green:#00ff9d;--amber:#ffb300;--red:#ff3b3b;--purple:#b48aff;--text:#a8d8f0;--text-hi:#d4eeff;--text-dim:#4c7798}
:root[data-theme="light"]{--bg:#f4f6fa;--panel:#fff;--surface:#fff;--border:#dbe4ee;--border-hi:#93b4d6;--cyan:#0284c7;--green:#059669;--amber:#b45309;--red:#dc2626;--purple:#7c3aed;--text:#1e293b;--text-hi:#0f172a;--text-dim:#64748b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif}
body{background-image:linear-gradient(rgba(0,212,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.014) 1px,transparent 1px);background-size:40px 40px}
.navbar{min-height:52px;padding:8px 16px;background:rgba(3,10,22,.97);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
:root[data-theme="light"] .navbar{background:rgba(255,255,255,.97)}
.nav-title{font-size:1.05rem;font-weight:700;color:var(--cyan);letter-spacing:.05em}.nav-space{flex:1}.nav-link{font-size:.72rem;color:var(--text-dim);border:1px solid var(--border);padding:6px 10px;border-radius:3px;text-decoration:none}.nav-link:hover{color:var(--cyan);border-color:var(--cyan)}
.app{display:grid;grid-template-columns:260px minmax(0,1fr) 280px;gap:14px;max-width:1800px;margin:0 auto;padding:14px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;min-width:0}.panel-head{padding:13px 14px;border-bottom:1px solid var(--border)}.panel-head h2{font-size:.92rem;color:var(--text-hi);margin:0 0 4px}.panel-head p{font-size:.68rem;color:var(--text-dim);margin:0;line-height:1.5}
.catalog{padding:10px;display:grid;gap:8px}.catalog-item{padding:10px;border:1px solid var(--border);border-radius:4px;background:var(--surface);cursor:pointer}.catalog-item:hover,.catalog-item.active{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,.08)}.catalog-title{font-size:.78rem;color:var(--text-hi);font-weight:700}.catalog-desc{font-size:.64rem;color:var(--text-dim);margin-top:3px;line-height:1.45}.catalog-state{font-size:.62rem;color:var(--green);float:right}.catalog-state.off{color:var(--red)}
.workspace{min-width:0}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;background:var(--panel);border:1px solid var(--border);border-radius:6px}.toolbar .title{font-weight:700;color:var(--text-hi);margin-right:auto}.btn{border:1px solid var(--border-hi);background:rgba(0,212,255,.06);color:var(--cyan);border-radius:4px;padding:7px 12px;font:inherit;font-size:.72rem;cursor:pointer}.btn:hover{border-color:var(--cyan);background:rgba(0,212,255,.12)}.btn.primary{color:#00131c;background:var(--cyan);font-weight:700}.btn.warn{color:var(--amber);border-color:rgba(255,179,0,.55);background:rgba(255,179,0,.06)}.btn:disabled{opacity:.45;cursor:not-allowed}
.save-state{font-size:.66rem;color:var(--text-dim);width:100%}.save-state.ok{color:var(--green)}.save-state.err{color:var(--red)}
.canvas{padding:8px;background:rgba(4,20,40,.55);border:1px dashed var(--border-hi);border-radius:6px;min-height:680px;overflow:auto}.grid-stack{min-height:650px}.grid-stack-placeholder>.placeholder-content{background:rgba(0,212,255,.12);border:1px dashed var(--cyan)}
.grid-stack-item-content{background:var(--panel);border:1px solid var(--border);border-radius:5px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.18)}.grid-stack-item.selected .grid-stack-item-content{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,212,255,.18)}.grid-stack-item.is-hidden .grid-stack-item-content{opacity:.42;border-style:dashed}
.widget-preview{height:100%;display:flex;flex-direction:column}.widget-drag{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:move;background:rgba(0,212,255,.035)}.widget-drag strong{font-size:.75rem;color:var(--text-hi)}.drag-mark{color:var(--cyan);letter-spacing:-2px}.widget-badge{margin-left:auto;font-size:.58rem;border:1px solid var(--border);padding:2px 6px;border-radius:10px;color:var(--text-dim)}.widget-body{flex:1;display:grid;place-items:center;padding:12px;color:var(--text-dim);font-size:.72rem;text-align:center;background:linear-gradient(135deg,transparent,rgba(0,212,255,.025))}.widget-bars{display:flex;align-items:flex-end;gap:5px;height:48px;margin-bottom:8px}.widget-bars i{display:block;width:12px;background:linear-gradient(var(--cyan),rgba(0,212,255,.2));border-radius:2px 2px 0 0}
.inspector{padding:12px}.field{margin-bottom:12px}.field label{display:block;font-size:.67rem;color:var(--text-dim);margin-bottom:5px}.field input,.field select{width:100%;padding:8px 9px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px}.field input:focus,.field select:focus{outline:none;border-color:var(--cyan)}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--text-hi)}.check input{accent-color:var(--cyan)}
.version-list{border-top:1px solid var(--border);padding:12px}.version-list h3{font-size:.76rem;color:var(--text-hi);margin:0 0 8px}.version-list select{width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px;margin-bottom:8px}.version-meta{font-size:.62rem;color:var(--text-dim);line-height:1.55}
.notice{padding:9px 12px;border:1px solid rgba(255,179,0,.45);background:rgba(255,179,0,.08);color:var(--amber);border-radius:4px;font-size:.7rem;margin-bottom:12px;display:none}.notice.show{display:block}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9999;color:var(--cyan);letter-spacing:.08em}.fatal{max-width:680px;padding:24px;border:1px solid var(--red);border-radius:6px;background:var(--panel);color:var(--text);line-height:1.7}.fatal strong{color:var(--red)}.fatal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.fatal-actions a,.fatal-actions button{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border:1px solid var(--border-hi);border-radius:4px;background:rgba(0,212,255,.06);color:var(--cyan);font:inherit;font-size:.72rem;text-decoration:none;cursor:pointer}.fatal-actions a:hover,.fatal-actions button:hover{border-color:var(--cyan)}
@media(max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.right-panel{grid-column:1/-1}.right-panel .inspector{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.right-panel .field{margin:0}.version-list{grid-column:1/-1}}
@media(max-width:760px){.app{display:block;padding:10px}.panel,.workspace{margin-bottom:10px}.catalog{grid-template-columns:1fr 1fr}.right-panel .inspector{display:block}.right-panel .field{margin-bottom:10px}.toolbar .title{width:100%;margin:0}.btn{flex:1}.canvas{min-height:520px}}
</style>
</head>
<body>
<div id="loading" class="loading">戰情版面編輯器載入中…</div>
<nav class="navbar">
  <div class="nav-title">戰情版面設定</div><div class="nav-space"></div>
  <a class="nav-link" href="dashboard.html">返回戰情儀表板</a>
  <a class="nav-link" href="admin.html">返回後台</a>
</nav>
<main class="app">
  <aside class="panel" aria-label="圖塊元件庫">
    <div class="panel-head"><h2>圖塊元件庫</h2><p>點選圖塊後，可在右側調整標題、尺寸與顯示狀態。</p></div>
    <div id="catalog" class="catalog"></div>
  </aside>

  <section class="workspace">
    <div class="toolbar">
      <div class="title">營運戰情總覽 · 12 欄版面</div>
      <button class="btn" id="previewBtn" type="button">開啟實際資料預覽</button>
      <button class="btn warn" id="resetBtn" type="button">套用預設版面</button>
      <button class="btn" id="saveBtn" type="button">儲存草稿</button>
      <button class="btn primary" id="publishBtn" type="button">發布新版</button>
      <div id="saveState" class="save-state">拖曳或縮放圖塊後，請儲存草稿或發布新版。</div>
    </div>
    <div id="notice" class="notice"></div>
    <div class="canvas"><div id="layoutGrid" class="grid-stack"></div></div>
  </section>

  <aside class="panel right-panel" aria-label="圖塊設定">
    <div class="panel-head"><h2>圖塊設定</h2><p id="selectedHint">請選擇一個圖塊</p></div>
    <div class="inspector">
      <div class="field"><label for="widgetTitle">顯示標題</label><input id="widgetTitle" maxlength="80" disabled></div>
      <div class="field-row">
        <div class="field"><label for="widgetWidth">寬度（1–12）</label><input id="widgetWidth" type="number" min="1" max="12" disabled></div>
        <div class="field"><label for="widgetHeight">高度（1–20）</label><input id="widgetHeight" type="number" min="1" max="20" disabled></div>
      </div>
      <div class="field"><label class="check"><input id="widgetVisible" type="checkbox" disabled> 前台顯示此圖塊</label></div>
    </div>
    <div class="version-list">
      <h3>版本發布與還原</h3>
      <select id="versionSelect"><option value="">載入中…</option></select>
      <button class="btn" id="loadVersionBtn" type="button" style="width:100%;margin-bottom:8px">載入選取版本預覽</button>
      <button class="btn warn" id="restoreBtn" type="button" style="width:100%">將選取版本重新發布</button>
      <div id="versionMeta" class="version-meta"></div>
    </div>
  </aside>
</main>

<script>
const db = createDb();
let grid=null,layoutRow=null,versions=[],selectedKey=null,dirty=false;
let titles={},visibility={};

function setState(message,type=''){
  const el=document.getElementById('saveState');el.textContent=message;el.className='save-state '+type;
}
function showNotice(message){const el=document.getElementById('notice');el.textContent=message;el.classList.add('show');}
function fatal(message){
  document.getElementById('loading').innerHTML='<div class="fatal"><strong>無法開啟戰情版面設定</strong><br>'+DashboardLayout.escapeHTML(message)+'<div class="fatal-actions"><button type="button" onclick="location.reload()">重新檢查</button><a href="https://raw.githubusercontent.com/jnfakimo/word-cloud/main/system/sql/dashboard_layouts.sql" target="_blank" rel="noopener">開啟安裝 SQL</a><a href="dashboard.html">返回戰情儀表板</a></div></div>';
}
function markDirty(){dirty=true;setState('版面有尚未儲存的修改。');}
function previewMarkup(c){
  const bars=[22,38,31,48,29].map(h=>'<i style="height:'+h+'px"></i>').join('');
  return '<div class="widget-preview"><div class="widget-drag"><span class="drag-mark">⠿</span><strong data-preview-title>'+DashboardLayout.escapeHTML(c.title)+'</strong><span class="widget-badge">'+DashboardLayout.escapeHTML(c.key)+'</span></div><div class="widget-body"><div><div class="widget-bars">'+bars+'</div>'+DashboardLayout.escapeHTML(c.description)+'</div></div></div>';
}
function buildGrid(items){
  if(grid)grid.destroy(false);
  document.getElementById('layoutGrid').innerHTML='';
  grid=GridStack.init({column:12,cellHeight:64,margin:6,float:false,animate:true,handle:'.widget-drag',resizable:{handles:'all'}},'#layoutGrid');
  const normalized=DashboardLayout.normalize(items);
  normalized.forEach(item=>{
    const c=DashboardLayout.byKey[item.widget_key];titles[item.widget_key]=item.title;visibility[item.widget_key]=item.visible;
    const el=grid.addWidget({id:item.widget_key,x:item.x,y:item.y,w:item.width,h:item.height,minW:item.min_width,minH:item.min_height});
    // GridStack 12 intentionally renders the `content` option as plain text.
    // Our preview is built from an allow-listed local catalog, so attach its escaped
    // markup to the generated content element after GridStack creates the widget.
    const content=el.querySelector('.grid-stack-item-content');
    if(content)content.innerHTML=previewMarkup(c);
    el.dataset.widgetKey=item.widget_key;el.classList.toggle('is-hidden',!item.visible);
    el.addEventListener('click',()=>selectWidget(item.widget_key));
  });
  grid.on('change resize',markDirty);
  renderCatalog();selectWidget(normalized[0].widget_key);dirty=false;
}
function renderCatalog(){
  document.getElementById('catalog').innerHTML=DashboardLayout.catalog.map(c=>'<div class="catalog-item '+(c.key===selectedKey?'active':'')+'" data-key="'+c.key+'"><span class="catalog-state '+(visibility[c.key]===false?'off':'')+'">'+(visibility[c.key]===false?'隱藏':'顯示')+'</span><div class="catalog-title">'+DashboardLayout.escapeHTML(titles[c.key]||c.title)+'</div><div class="catalog-desc">'+DashboardLayout.escapeHTML(c.description)+'</div></div>').join('');
  document.querySelectorAll('.catalog-item').forEach(el=>el.addEventListener('click',()=>selectWidget(el.dataset.key)));
}
function selectWidget(key){
  selectedKey=key;document.querySelectorAll('.grid-stack-item').forEach(el=>el.classList.toggle('selected',el.dataset.widgetKey===key));renderCatalog();
  const el=document.querySelector('.grid-stack-item[data-widget-key="'+key+'"]');const n=el&&el.gridstackNode;
  document.getElementById('selectedHint').textContent=DashboardLayout.byKey[key].description;
  const t=document.getElementById('widgetTitle'),w=document.getElementById('widgetWidth'),h=document.getElementById('widgetHeight'),v=document.getElementById('widgetVisible');
  [t,w,h,v].forEach(x=>x.disabled=false);t.value=titles[key];w.value=n?.w||1;h.value=n?.h||1;v.checked=visibility[key]!==false;
}
function updateSelected(){
  if(!selectedKey)return;const el=document.querySelector('.grid-stack-item[data-widget-key="'+selectedKey+'"]');if(!el)return;
  titles[selectedKey]=document.getElementById('widgetTitle').value.trim()||DashboardLayout.byKey[selectedKey].title;
  visibility[selectedKey]=document.getElementById('widgetVisible').checked;
  const w=Math.max(1,Math.min(12,Number(document.getElementById('widgetWidth').value)||1));
  const h=Math.max(1,Math.min(20,Number(document.getElementById('widgetHeight').value)||1));
  grid.update(el,{w,h});el.classList.toggle('is-hidden',!visibility[selectedKey]);
  const title=el.querySelector('[data-preview-title]');if(title)title.textContent=titles[selectedKey];renderCatalog();markDirty();
}
function currentPayload(){return DashboardLayout.payloadFromGrid(grid,titles,visibility);}
async function loadItems(versionId){
  if(!versionId){buildGrid(DashboardLayout.defaults());return;}
  const {data,error}=await db.from('dashboard_layout_items').select('*').eq('version_id',versionId).order('sort_order');
  if(error)throw error;buildGrid(data);
}
async function loadVersions(){
  const {data,error}=await db.from('dashboard_layout_versions').select('*').eq('layout_id',layoutRow.layout_id).order('version_no',{ascending:false}).limit(30);
  if(error)throw error;versions=data||[];
  const select=document.getElementById('versionSelect');select.innerHTML=versions.map(v=>'<option value="'+v.version_id+'">V'+v.version_no+' · '+({published:'已發布',draft:'草稿',archived:'歷史',failed:'失敗'}[v.state]||v.state)+' · '+SystemDate.formatDateTime(v.created_at)+'</option>').join('');
  select.value=layoutRow.published_version_id||versions[0]?.version_id||'';updateVersionMeta();
}
function updateVersionMeta(){
  const v=versions.find(x=>x.version_id===document.getElementById('versionSelect').value);
  document.getElementById('versionMeta').textContent=v?(v.version_note||'無版本說明')+'｜建立時間 '+SystemDate.formatDateTime(v.created_at):'尚無版本';
}
async function saveVersion(publish){
  const note=prompt(publish?'請輸入本次發布說明：':'請輸入草稿說明：',publish?'調整戰情儀表板版面':'版面調整草稿');if(note===null)return;
  toggleButtons(true);setState(publish?'正在發布新版…':'正在儲存草稿…');
  const {data,error}=await db.rpc('save_dashboard_layout_version',{p_layout_id:layoutRow.layout_id,p_items:currentPayload(),p_note:note,p_publish:publish});
  toggleButtons(false);if(error){setState('儲存失敗：'+safeDbError(error),'err');return;}
  dirty=false;setState(publish?'新版已發布，前台重新整理後即會套用。':'草稿已儲存。','ok');
  const {data:fresh,error:freshErr}=await db.from('dashboard_layouts').select('*').eq('layout_id',layoutRow.layout_id).single();
  if(freshErr) console.warn('dashboard_layouts refresh after save failed',freshErr);
  if(fresh)layoutRow=fresh;
  await loadVersions();document.getElementById('versionSelect').value=data;updateVersionMeta();
}
async function restoreVersion(){
  const id=document.getElementById('versionSelect').value;if(!id)return;
  const v=versions.find(x=>x.version_id===id);if(!confirm('確定將 V'+v.version_no+' 重新發布為正式版面？'))return;
  toggleButtons(true);const {error}=await db.rpc('publish_dashboard_layout_version',{p_version_id:id});toggleButtons(false);
  if(error){setState('還原失敗：'+safeDbError(error),'err');return;}
  layoutRow.published_version_id=id;setState('V'+v.version_no+' 已重新發布。','ok');await loadVersions();
}
function toggleButtons(disabled){['saveBtn','publishBtn','previewBtn','restoreBtn','loadVersionBtn','resetBtn'].forEach(id=>document.getElementById(id).disabled=disabled);}
async function init(){
  const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html?redirect=dashboard-builder.html';return;}
  const {data:allowed,error:accessError}=await db.rpc('can_manage_dashboard_layout');
  if(accessError){fatal('請先在 Supabase SQL Editor 執行 system/sql/dashboard_layouts.sql；若剛執行完成，請稍候數秒後按「重新檢查」。詳細訊息：'+accessError.message);return;}
  if(!allowed){fatal('目前帳號沒有編輯戰情儀表板版面的權限。');return;}
  const {data,error}=await db.from('dashboard_layouts').select('*').eq('layout_code','operations_main').single();
  if(error||!data){fatal('找不到儀表板版面主檔，請重新執行 system/sql/dashboard_layouts.sql。');return;}
  layoutRow=data;await loadVersions();await loadItems(layoutRow.published_version_id);document.getElementById('loading').style.display='none';setState('已載入目前發布版面。','ok');
}

document.getElementById('widgetTitle').addEventListener('change',updateSelected);
document.getElementById('widgetWidth').addEventListener('change',updateSelected);
document.getElementById('widgetHeight').addEventListener('change',updateSelected);
document.getElementById('widgetVisible').addEventListener('change',updateSelected);
document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('確定將編輯畫布恢復為系統預設版面？')){titles={};visibility={};buildGrid(DashboardLayout.defaults());markDirty();}});
document.getElementById('saveBtn').addEventListener('click',()=>saveVersion(false));
document.getElementById('publishBtn').addEventListener('click',()=>saveVersion(true));
document.getElementById('previewBtn').addEventListener('click',()=>{
  if(dirty){alert('請先儲存草稿，再開啟實際資料預覽。');return;}
  const id=document.getElementById('versionSelect').value;if(id)window.open('dashboard.html?layoutPreview='+encodeURIComponent(id),'_blank','noopener');
});
document.getElementById('restoreBtn').addEventListener('click',restoreVersion);
document.getElementById('loadVersionBtn').addEventListener('click',async()=>{
  const id=document.getElementById('versionSelect').value;if(!id)return;
  if(dirty&&!confirm('目前有尚未儲存的修改，確定載入其他版本？'))return;
  await loadItems(id);setState('已載入選取版本，可繼續調整後另存草稿或發布。','ok');
});
document.getElementById('versionSelect').addEventListener('change',updateVersionMeta);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
init().catch(e=>fatal(e.message||String(e)));
</script>
</body>
</html>
