<style>
:root{--bg:#020b18;--surface:#04111f;--panel:#05101e;--border:#0c2840;--border-hi:#1a4a70;
  --cyan:#00d4ff;--patrol:#c77dff;--green:#00ff9d;--red:#ff5470;
  --text:#a8d8f0;--text-hi:#d4eeff;--text-dim:#3a6a8a;
  --font-head:'Rajdhani',sans-serif}
:root[data-theme="light"]{--bg:#f4f6fa;--surface:#ffffff;--panel:#ffffff;--border:#dbe4ee;--border-hi:#93b4d6;
  --cyan:#0284c7;--patrol:#9333ea;--green:#059669;--red:#dc2626;
  --text:#1e293b;--text-hi:#0f172a;--text-dim:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
a{color:inherit;text-decoration:none}

.navbar{background:rgba(3,10,22,.97);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;overflow-x:auto;overflow-y:hidden}
:root[data-theme="light"] .navbar{background:rgba(255,255,255,.97)}
.nav-title{font-family:var(--font-head);font-size:1.1rem;font-weight:700;color:var(--patrol);letter-spacing:.06em}
.nav-sub{font-size:.7rem;color:var(--text-dim)}
.nav-space{flex:1 0 auto}.navbar a{flex:0 0 auto}
.nav-back{font-size:.7rem;color:var(--text-dim);border:1px solid var(--border);padding:5px 10px;border-radius:2px;cursor:pointer;background:none;
  transition:all .2s;font-family:var(--font-head);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.nav-back:hover{border-color:var(--patrol);color:var(--patrol)}

.content{padding:14px 16px;max-width:900px;margin:0 auto}
.hint{font-size:.72rem;color:var(--text-dim);margin-bottom:14px;line-height:1.6;background:var(--surface);
  border:1px solid var(--border);border-left:2px solid var(--patrol);border-radius:2px;padding:9px 12px}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:16px;margin-bottom:16px}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2{font-family:var(--font-head);font-size:1rem;color:var(--text-hi);letter-spacing:.04em}
.panel-h .sp{flex:1}

.datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.datebar input[type=date]{background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:7px 10px;border-radius:2px;font-size:.85rem;outline:none}
.datebar input[type=date]:focus{border-color:var(--patrol)}

.btn{padding:7px 14px;border-radius:2px;cursor:pointer;font-size:.75rem;font-family:var(--font-head);
  letter-spacing:.04em;text-transform:uppercase;transition:all .2s;border:1px solid var(--border);background:none;color:var(--text-dim)}
.btn:hover{border-color:var(--patrol);color:var(--patrol)}
.btn-add{background:rgba(199,125,255,.1);border:1px solid var(--patrol);color:var(--patrol)}
.btn-add:hover{background:rgba(199,125,255,.2)}

table{width:100%;border-collapse:collapse;font-size:.82rem}
.schedule-table{table-layout:fixed;min-width:760px}
.schedule-table col:nth-child(1){width:10%}
.schedule-table col:nth-child(2),.schedule-table col:nth-child(3){width:21%}
.schedule-table col:nth-child(4){width:27%}
.schedule-table col:nth-child(5){width:21%}
#shiftList,#tplList{overflow-x:auto}
th{text-align:left;color:var(--text-dim);font-size:.68rem;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid rgba(12,40,64,.4)}
tr:last-child td{border-bottom:none}
.time{font-family:var(--font-head);color:var(--text-hi)}
.acts{display:flex;gap:6px}
.mini{font-size:.68rem;padding:3px 9px;border:1px solid var(--border);border-radius:2px;cursor:pointer;background:none;color:var(--text-dim);transition:all .2s}
.mini:hover{border-color:var(--patrol);color:var(--patrol)}
.mini.del:hover{border-color:var(--red);color:var(--red)}
.empty{text-align:center;padding:30px 10px;color:var(--text-dim);font-size:.82rem}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(1,6,14,.82);z-index:200;align-items:flex-start;justify-content:center;overflow:auto;padding:60px 16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border-hi);border-radius:4px;width:100%;max-width:380px}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-head .mt{font-family:var(--font-head);font-size:1rem;font-weight:700;color:var(--patrol);letter-spacing:.05em}
.modal-head .x{margin-left:auto;cursor:pointer;color:var(--text-dim);font-size:1.1rem}
.modal-head .x:hover{color:var(--red)}
.modal-body{padding:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.72rem;color:var(--text-dim);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:2px;font-size:.85rem;outline:none}
.field input:focus,.field select:focus{border-color:var(--patrol)}
.time-range-field{display:grid;grid-template-columns:72px minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.time-range-field label{margin:0;white-space:nowrap}
.time-range-field input{min-width:0;padding:9px 7px}
.time-range-sep{color:var(--text-dim);font-size:.78rem}
.staff-list{font-size:.72rem;color:var(--text-dim);line-height:1.6}
.btn-primary{width:100%;background:rgba(199,125,255,.12);border:1px solid var(--patrol);color:var(--patrol);
  padding:11px;border-radius:2px;cursor:pointer;font-size:.85rem;font-family:var(--font-head);letter-spacing:.06em;text-transform:uppercase}
.btn-primary:hover{background:rgba(199,125,255,.22)}
.msg{font-size:.75rem;margin-top:8px;min-height:16px;color:var(--red)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--panel);border:1px solid var(--patrol);color:var(--text-hi);padding:11px 20px;
  border-radius:3px;font-size:.8rem;z-index:300;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--red)}
</style>

<div class="content">
  <div class="hint">
    班別名稱與數量固定來自下方「預設範本」，每天可個別調整這幾個班別的上班時段與通報時段，不能單日新增或刪除班別本身；
    要增減班別請到下方「預設範本」設定。所有班別巡守同一組巡檢點（即「巡邏點清單」內的巡邏點），不需另外指定。
  </div>

  <div class="panel">
    <div class="panel-h">
      <h2>當日班別</h2>
      <div class="sp"></div>
    </div>
    <div class="datebar">
      <button class="mini" onclick="shiftDate(-1)">◀</button>
      <input type="date" id="datePick" onchange="load()">
      <button class="mini" onclick="shiftDate(1)">▶</button>
      <button class="mini" onclick="goToday()">今天</button>
    </div>
    <div id="shiftList"></div>
  </div>

  <div class="panel">
    <div class="panel-h">
      <h2>預設範本</h2>
      <div class="sp"></div>
      <button class="btn btn-add" onclick="openTplModal()">＋ 新增範本班別</button>
    </div>
    <div id="tplList"></div>
  </div>
</div>

<!-- 當日班別 modal（班別名稱固定來自範本） -->
<div class="modal-bg" id="m-shift">
  <div class="modal">
    <div class="modal-head"><span class="mt" id="shiftTitle">調整班別</span><span class="x" onclick="closeModal('m-shift')">✕</span></div>
    <div class="modal-body">
      <div class="field time-range-field"><label>上班時段</label><input id="f-work-start" type="time" step="1800" aria-label="上班開始時間" data-time-end-id="f-work-end"><span class="time-range-sep">～</span><input id="f-work-end" type="time" step="1800" aria-label="上班結束時間"></div>
      <div class="field time-range-field"><label>通報時段</label><input id="f-start" type="time" step="1800" aria-label="通報開始時間" data-time-end-id="f-end"><span class="time-range-sep">～</span><input id="f-end" type="time" step="1800" aria-label="通報結束時間"></div>
      <div class="field"><label>當班巡檢人員（可複選）</label><select id="f-users" multiple size="6"></select></div>
      <div class="msg" id="shiftMsg"></div>
      <button class="btn-primary" onclick="saveShift()">儲存</button>
    </div>
  </div>
</div>

<!-- 範本 modal -->
<div class="modal-bg" id="m-tpl">
  <div class="modal">
    <div class="modal-head"><span class="mt" id="tplTitle">新增範本班別</span><span class="x" onclick="closeModal('m-tpl')">✕</span></div>
    <div class="modal-body">
      <div class="field"><label>班別名稱</label><input id="tf-name" placeholder="例：早班"></div>
      <div class="field time-range-field"><label>上班時段</label><input id="tf-work-start" type="time" step="1800" aria-label="上班開始時間" data-time-end-id="tf-work-end"><span class="time-range-sep">～</span><input id="tf-work-end" type="time" step="1800" aria-label="上班結束時間"></div>
      <div class="field time-range-field"><label>通報時段</label><input id="tf-start" type="time" step="1800" aria-label="通報開始時間" data-time-end-id="tf-end"><span class="time-range-sep">～</span><input id="tf-end" type="time" step="1800" aria-label="通報結束時間"></div>
      <div class="field"><label>預設巡檢人員（可複選）</label><select id="tf-users" multiple size="6"></select></div>
      <div class="msg" id="tplMsg"></div>
      <button class="btn-primary" onclick="saveTpl()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const db = createDb();
async function initPatrolShiftPage(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.href='login.html?redirect='+encodeURIComponent('patrolshifts.html');return;}
  if(!window.SystemAccess||typeof window.SystemAccess.enforceSysadmin!=='function'){location.replace('guardpatrol-index.html?denied=sysadmin');return;}
  if(!(await window.SystemAccess.enforceSysadmin('guardpatrol-index.html')))return;
  await load();
}
function translateError(msg){
  if(!msg) return '未知錯誤';
  if(msg.includes('duplicate key value')) return '同一天已有相同名稱的班別';
  if(msg.includes('null value in column')) return '必填欄位不可空白';
  if(msg.includes('permission denied')||msg.includes('violates row-level security')) return '無操作權限';
  if((msg.includes('relation') && msg.includes('does not exist'))||msg.includes('schema cache')||msg.includes('Could not find the table')) return '資料表不存在，請先於 Supabase SQL Editor 執行 system/sql/patrol_shifts.sql';
  if(msg.includes('Failed to fetch')||msg.includes('NetworkError')) return '網路連線失敗，請稍後再試';
  return '操作失敗，請稍後再試或聯絡系統管理員（原始訊息：'+msg+'）';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2200);}
function fmtHM(t){return String(t||'').slice(0,5);}
function isHalfHour(t){return /^\d{2}:(00|30)$/.test(String(t||''));}
let staffRows=[],deptNames={},staffAssignments={templates:{},dates:{},workTimes:{templates:{},dates:{}}};
async function loadStaff(){
  const [u,d,setting]=await Promise.all([
    db.from('users').select('user_id,name,department,dept_id').eq('status','active').order('name'),
    db.from('departments').select('dept_id,name').eq('status','active'),
    db.from('system_settings').select('value').eq('key','patrol_shift_staff').maybeSingle()
  ]);
  if(u.error||d.error||setting.error){
    toast('人員/部門資料載入失敗，排班清單可能不完整，請重新整理頁面',true);
    console.warn('loadStaff partial failure',{userErr:u.error,deptErr:d.error,settingErr:setting.error});
  }
  (d.data||[]).forEach(x=>deptNames[x.dept_id]=x.name);
  staffRows=(u.data||[]).filter(x=>String(x.department||deptNames[x.dept_id]||'').includes('駐衛'));
  try{staffAssignments=JSON.parse(setting.data?.value||'null')||{templates:{},dates:{},workTimes:{templates:{},dates:{}}};}catch(e){staffAssignments={templates:{},dates:{},workTimes:{templates:{},dates:{}}};}
  staffAssignments.templates||={};staffAssignments.dates||={};
  staffAssignments.workTimes||={};staffAssignments.workTimes.templates||={};staffAssignments.workTimes.dates||={};
}
function staffName(id){const u=staffRows.find(x=>x.user_id===id);return u?`${u.department||deptNames[u.dept_id]||'未設定單位'}｜${u.name}`:'未知人員';}
function staffText(ids){return (ids||[]).length?(ids||[]).map(staffName).join('、'):'尚未指派';}
function fillStaffSelect(selectId,ids){
  const selected=new Set(ids||[]),el=document.getElementById(selectId);if(!el)return;
  el.innerHTML=staffRows.map(u=>`<option value="${esc(u.user_id)}" ${selected.has(u.user_id)?'selected':''}>${esc(staffName(u.user_id))}</option>`).join('');
}
function selectedStaff(selectId){return [...document.getElementById(selectId).selectedOptions].map(o=>o.value);}
// 人員指派的寫入已移入 save_patrol_shift / save_patrol_shift_template，
// 由伺服器端對 patrol_shift_staff 做局部合併，前端不再整包覆寫。

function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function goToday(){document.getElementById('datePick').value=todayStr();load();}
function shiftDate(delta){
  const el=document.getElementById('datePick');
  const d=new Date(el.value+'T00:00:00');
  d.setDate(d.getDate()+delta);
  const p=n=>String(n).padStart(2,'0');
  el.value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  load();
}

let shiftRows=[], tplRows=[], editShiftName=null;

async function load(){
  if(!staffRows.length) await loadStaff();
  if(!tplRows.length) await loadTpl();
  const dateStr=document.getElementById('datePick').value;
  const {data,error}=await db.from('patrol_shifts').select('*').eq('shift_date',dateStr);
  if(error){document.getElementById('shiftList').innerHTML='<div class="empty">讀取失敗：'+esc(translateError(error.message))+'</div>';return;}
  const overrides=new Map((data||[]).map(s=>[s.name,s]));
  // 班別名稱／數量固定來自範本；當天若有客製時段就用客製的，否則用範本預設時段
  shiftRows=tplRows.map(t=>{
    const ov=overrides.get(t.name);
    const dateStaff=staffAssignments.dates?.[dateStr]?.[t.name];
    const tplWork=staffAssignments.workTimes.templates?.[t.name]||{};
    const dateWork=staffAssignments.workTimes.dates?.[dateStr]?.[t.name]||{};
    return {name:t.name, start_time:ov?ov.start_time:t.start_time, end_time:ov?ov.end_time:t.end_time,
      work_start_time:dateWork.start||tplWork.start||t.start_time,
      work_end_time:dateWork.end||tplWork.end||t.end_time,
      assigned_user_ids:dateStaff||staffAssignments.templates?.[t.name]||[],sort_order:t.sort_order,
      customized:!!ov||Boolean(staffAssignments.workTimes.dates?.[dateStr]?.[t.name])};
  });
  renderShifts();
}

function renderShifts(){
  const box=document.getElementById('shiftList');
  if(!shiftRows.length){box.innerHTML='<div class="empty">尚未設定範本班別，請先在下方「預設範本」新增。</div>';return;}
  box.innerHTML=`<table class="schedule-table"><colgroup><col><col><col><col><col></colgroup><tr><th>班別</th><th>上班時段</th><th>通報時段</th><th>當班部門／巡檢人員</th><th></th></tr>`+
    shiftRows.map(s=>`<tr>
      <td>${esc(s.name)}${s.customized?' <small style="color:var(--patrol)">（已調整）</small>':''}</td>
      <td class='time'>${fmtHM(s.work_start_time)} – ${fmtHM(s.work_end_time)}</td>
      <td class="time">${fmtHM(s.start_time)} – ${fmtHM(s.end_time)}</td>
      <td class="staff-list">${esc(staffText(s.assigned_user_ids))}</td>
      <td><div class="acts">
        <button class="mini" onclick="openShiftModal('${esc(s.name)}')">調整班別</button>
      </div></td>
    </tr>`).join('')+`</table>`;
}

async function loadTpl(){
  const {data,error}=await db.from('patrol_shift_template').select('*').order('sort_order');
  if(error){document.getElementById('tplList').innerHTML='<div class="empty">讀取失敗：'+esc(translateError(error.message))+'</div>';return;}
  tplRows=data||[];
  renderTpl();
}
function renderTpl(){
  const box=document.getElementById('tplList');
  if(!tplRows.length){box.innerHTML='<div class="empty">尚無範本班別。</div>';return;}
  box.innerHTML=`<table class="schedule-table"><colgroup><col><col><col><col><col></colgroup><tr><th>班別</th><th>上班時段</th><th>通報時段</th><th>預設巡檢人員</th><th></th></tr>`+
    tplRows.map(s=>`<tr>
      <td>${esc(s.name)}</td>
      <td class='time'>${fmtHM(staffAssignments.workTimes.templates?.[s.name]?.start||s.start_time)} – ${fmtHM(staffAssignments.workTimes.templates?.[s.name]?.end||s.end_time)}</td>
      <td class="time">${fmtHM(s.start_time)} – ${fmtHM(s.end_time)}</td>
      <td class="staff-list">${esc(staffText(staffAssignments.templates?.[s.name]||[]))}</td>
      <td><div class="acts">
        <button class="mini" onclick="openTplModal('${s.template_id}')">編輯</button>
        <span class="mini" title="班別範本永久保存">永久保留</span>
      </div></td>
    </tr>`).join('')+`</table>`;
}

function closeModal(id){document.getElementById(id).classList.remove('show');}

function openShiftModal(name){
  editShiftName=name;
  const s=shiftRows.find(x=>x.name===name);if(!s)return;
  document.getElementById('shiftTitle').textContent=name+'　調整班別';
  document.getElementById('shiftMsg').textContent='';
  document.getElementById('f-work-start').value=fmtHM(s.work_start_time);
  document.getElementById('f-work-end').value=fmtHM(s.work_end_time);
  document.getElementById('f-start').value=fmtHM(s.start_time);
  document.getElementById('f-end').value=fmtHM(s.end_time);
  fillStaffSelect('f-users',s.assigned_user_ids);
  document.getElementById('m-shift').classList.add('show');
}
async function saveShift(){
  const workStart=document.getElementById('f-work-start').value;
  const workEnd=document.getElementById('f-work-end').value;
  const start=document.getElementById('f-start').value;
  const end=document.getElementById('f-end').value;
  const msg=document.getElementById('shiftMsg');
  if(!workStart||!workEnd||!start||!end){msg.textContent='請完整填寫上班與通報時段';return;}
  if(![workStart,workEnd,start,end].every(isHalfHour)){msg.textContent='時間請以半小時為單位（00 或 30 分）';return;}
  const dateStr=document.getElementById('datePick').value;
  const s=shiftRows.find(x=>x.name===editShiftName);
  // 班別時段與人員指派改由 save_patrol_shift 於單一交易寫入；人員指派在伺服器端
  // 只更新該日期／班別的節點，不再整包覆寫。記憶體狀態等成功後才更新，避免失敗時
  // 畫面已顯示成已儲存但資料庫沒有。
  const staff=selectedStaff('f-users');
  const {error}=await db.rpc('save_patrol_shift',{
    p_shift_date:dateStr,p_name:editShiftName,p_start_time:start,p_end_time:end,
    p_sort_order:s?s.sort_order:0,p_staff:staff,p_work_start:workStart,p_work_end:workEnd});
  if(error){msg.textContent=translateError(error.message);return;}
  staffAssignments.dates[dateStr]||={};staffAssignments.dates[dateStr][editShiftName]=staff;
  staffAssignments.workTimes.dates[dateStr]||={};staffAssignments.workTimes.dates[dateStr][editShiftName]={start:workStart,end:workEnd};
  closeModal('m-shift');toast('已更新');await load();
}

function openTplModal(id){
  editTplId=id||null;
  document.getElementById('tplTitle').textContent=id?'編輯範本班別':'新增範本班別';
  document.getElementById('tplMsg').textContent='';
  if(id){
    const s=tplRows.find(x=>x.template_id===id);
    const work=staffAssignments.workTimes.templates?.[s.name]||{};
    document.getElementById('tf-name').value=s.name;
    document.getElementById('tf-work-start').value=fmtHM(work.start||s.start_time);
    document.getElementById('tf-work-end').value=fmtHM(work.end||s.end_time);
    document.getElementById('tf-start').value=fmtHM(s.start_time);
    document.getElementById('tf-end').value=fmtHM(s.end_time);
    fillStaffSelect('tf-users',staffAssignments.templates?.[s.name]||[]);
  }else{
    document.getElementById('tf-name').value='';
    document.getElementById('tf-work-start').value='';
    document.getElementById('tf-work-end').value='';
    document.getElementById('tf-start').value='';
    document.getElementById('tf-end').value='';
    fillStaffSelect('tf-users',[]);
  }
  document.getElementById('m-tpl').classList.add('show');
}
async function saveTpl(){
  const name=document.getElementById('tf-name').value.trim();
  const workStart=document.getElementById('tf-work-start').value;
  const workEnd=document.getElementById('tf-work-end').value;
  const start=document.getElementById('tf-start').value;
  const end=document.getElementById('tf-end').value;
  const msg=document.getElementById('tplMsg');
  if(!name||!workStart||!workEnd||!start||!end){msg.textContent='請完整填寫班別名稱、上班時段與通報時段';return;}
  if(![workStart,workEnd,start,end].every(isHalfHour)){msg.textContent='時間請以半小時為單位（00 或 30 分）';return;}
  const sortOrder=editTplId?tplRows.find(x=>x.template_id===editTplId).sort_order:(tplRows.length?Math.max(...tplRows.map(s=>s.sort_order))+1:1);
  // 範本與人員指派同樣改由單一交易寫入，見 save_patrol_shift 的說明。
  const staff=selectedStaff('tf-users');
  const {error}=await db.rpc('save_patrol_shift_template',{
    p_template_id:editTplId,p_name:name,p_start_time:start,p_end_time:end,
    p_sort_order:sortOrder,p_staff:staff,p_work_start:workStart,p_work_end:workEnd});
  if(error){msg.textContent=translateError(error.message);return;}
  staffAssignments.templates[name]=staff;
  staffAssignments.workTimes.templates[name]={start:workStart,end:workEnd};
  closeModal('m-tpl');toast(editTplId?'已更新':'已新增');await loadTpl();await load();
}
async function delTpl(id){
  const s=tplRows.find(x=>x.template_id===id);if(!s)return;
  toast(`「${s.name}」為永久資料，不能刪除`,true);
}

document.getElementById('m-shift').addEventListener('click',e=>{if(e.target.id==='m-shift')closeModal('m-shift');});
document.getElementById('m-tpl').addEventListener('click',e=>{if(e.target.id==='m-tpl')closeModal('m-tpl');});

document.getElementById('datePick').value=todayStr();
initPatrolShiftPage();
</script>
</body>
