<style>

.navbar{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(3,10,22,.97);border-bottom:1px solid var(--border);overflow-x:auto}

.nav-space{flex:1}
.nav-btn{white-space:nowrap;border:1px solid var(--border);background:transparent;color:var(--text-dim);padding:6px 10px;border-radius:3px;font-size:.72rem;cursor:pointer}

.content{max-width:1400px;margin:0 auto;padding:16px}
.hero{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}

<script>
const db = createDb();

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function translateError(msg){
  if(!msg) return '未知錯誤';
  if(msg.includes('meeting_bookings_no_overlap')||msg.includes('exclusion')) return '此時段該會議室已被預約，請改選其他時段';
  if(msg.includes('duplicate key value')) return '資料重複，請確認是否已存在';
  if(msg.includes('null value in column')) return '必填欄位不可空白';
  if(msg.includes('violates row-level security')||msg.includes('permission denied')) return '無操作權限';
  if(msg.includes('Failed to fetch')||msg.includes('NetworkError')) return '網路連線失敗，請稍後再試';
  if(/[\u3400-\u9fff]/.test(msg)) return msg;
  return '操作失敗，請稍後再試或聯絡系統管理員';
}
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
let _tt;
function toast(msg,err){const el=document.getElementById('toast');el.textContent=msg;el.classList.toggle('err',!!err);el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2600);}

async function writeAudit(table,recordId,action,before,after){
  if(!currentUser) return;
  try{ await db.from('audit_logs').insert({table_name:table,record_id:String(recordId),action,changes:{before,after},operator_id:currentUser.user_id}); }catch(e){}
}

let currentUser=null;
let rooms=[];          // active meeting_rooms
let allRooms=[];        // all rooms incl. inactive (admin management)
let weekBookings=[];    // bookings overlapping the visible week
let myBookings=[];
let weekStart=mondayOf(new Date());
let editingRoomId=null;
let activeConflict=null;
let changeTargetBookingId=null;
let changeRequests=[];
const userProfiles=new Map();
const departmentNames=new Map();
const changeRequestBookings=new Map();

function mondayOf(d){
  const x=new Date(d);
  const day=(x.getDay()+6)%7; // 0=Mon
  x.setDate(x.getDate()-day);
  x.setHours(0,0,0,0);
  return x;
}
function isoDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;}
function todayISO(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date());}
function fmtMD(d){return `${d.getMonth()+1}/${d.getDate()}`;}
const DOW=['一','二','三','四','五','六','日'];

function timeValue(minutes){return `${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`;}
function addISODate(dateStr,days){const d=new Date(`${dateStr}T12:00:00+08:00`);d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);}
function bookingStartAt(dateStr,start){return new Date(`${dateStr}T${start}:00+08:00`);}
function isPastBookingSlot(dateStr,start){return !dateStr||!start||bookingStartAt(dateStr,start)<=new Date();}
function recurringDates(dateStr,repeatWeekly,repeatUntil){
  if(!dateStr)return [];
  if(!repeatWeekly)return [dateStr];
  if(!repeatUntil)throw new Error('請選擇週期截止日期');
  if(repeatUntil<dateStr)throw new Error('週期截止日期不得早於首次預約日期');
  const dates=[];
  for(let date=dateStr;date<=repeatUntil;date=addISODate(date,7)){
    dates.push(date);
    if(dates.length>52)throw new Error('週期預約最多 52 次');
  }
  return dates;
}
function installTimeOptions(){
  const periodOptions='<option value="">上／下午</option><option value="am">上午</option><option value="pm">下午</option>';
  const hourOptions='<option value="">時</option>'+Array.from({length:12},(_,i)=>`<option value="${i+1}">${String(i+1).padStart(2,'0')}</option>`).join('');
  const minuteOptions='<option value="">分</option><option value="00">00</option><option value="30">30</option>';
  ['Start','End'].forEach(prefix=>{
    document.getElementById(`bk${prefix}Period`).innerHTML=periodOptions;
    document.getElementById(`bk${prefix}Hour`).innerHTML=hourOptions;
    document.getElementById(`bk${prefix}Minute`).innerHTML=minuteOptions;
  });
}
function selectedTime(prefix){
  const period=document.getElementById(`bk${prefix}Period`).value;
  const hourValue=document.getElementById(`bk${prefix}Hour`).value;
  const minute=document.getElementById(`bk${prefix}Minute`).value;
  if(!period||!hourValue||minute==='')return '';
  let hour=Number(hourValue);
  if(period==='am'&&hour===12)hour=0;
  if(period==='pm'&&hour!==12)hour+=12;
  return `${String(hour).padStart(2,'0')}:${minute}`;
}
function setTimeParts(prefix,value){
  let period='',hour='',minute='';
  if(value){
    const [hour24,min]=value.split(':').map(Number);
    period=hour24<12?'am':'pm';
    hour=String(hour24%12||12);
    minute=String(min).padStart(2,'0');
  }
  document.getElementById(`bk${prefix}Period`).value=period;
  document.getElementById(`bk${prefix}Hour`).value=hour;
  document.getElementById(`bk${prefix}Minute`).value=minute;
}
function onTimePartChange(prefix){
  const start=selectedTime('Start'),end=selectedTime('End');
  if(prefix==='Start'&&start&&(!end||end<=start)){
    const [h,m]=start.split(':').map(Number),next=h*60+m+30;
    setTimeParts('End',next<=1410?timeValue(next):'');
  }
  checkConflictSoon();
}

async function ensureUserProfiles(userIds){
  const ids=[...new Set((userIds||[]).filter(Boolean))];
  const missing=ids.filter(id=>!userProfiles.has(id));
  if(missing.length){
    const {data,error}=await db.from('users').select('user_id,name,department,dept_id').in('user_id',missing);
    if(!error)(data||[]).forEach(u=>userProfiles.set(u.user_id,u));
  }
  const deptIds=[...new Set(ids.map(id=>userProfiles.get(id)?.dept_id).filter(id=>id&&!departmentNames.has(id)))];
  if(deptIds.length){
    const {data,error}=await db.from('departments').select('dept_id,name').in('dept_id',deptIds);
    if(!error)(data||[]).forEach(d=>departmentNames.set(d.dept_id,d.name));
  }
}
function profileLabel(userId){
  const u=userProfiles.get(userId);
  if(!u)return '部門未設定／人員未設定';
  const dept=departmentNames.get(u.dept_id)||u.department||'部門未設定';
  return `${dept}／${u.name||'人員未設定'}`;
}

function weekDays(){
  const out=[];
  for(let i=0;i<7;i++){const d=new Date(weekStart);d.setDate(d.getDate()+i);out.push(d);}
  return out;
}

async function loadWeek(){
  document.getElementById('weekLabel').textContent=`${fmtMD(weekStart)} — ${fmtMD(weekDays()[6])}`;
  const days=weekDays();
  const from=isoDate(days[0]),to=isoDate(days[6]);
  const {data,error}=await db.from('meeting_bookings').select('*').gte('booking_date',from).lte('booking_date',to).in('status',['booked','checked_in']).order('start_time');
  if(error){document.getElementById('gridBox').innerHTML='讀取失敗：'+esc(translateError(error.message));return;}
  weekBookings=data||[];
  await ensureUserProfiles(weekBookings.map(b=>b.user_id));
  renderGrid();
}

function renderGrid(){
  const box=document.getElementById('gridBox');
  if(!rooms.length){box.innerHTML='<div class="empty">尚未建立會議室，請洽系統管理員於「會議室管理」新增。</div>';return;}
  const days=weekDays();
  let h='<table class="roomgrid"><tr><th style="min-width:110px">會議室</th>'+days.map(d=>`<th class="${d.getDay()===0||d.getDay()===6?'weekend':''}">週${DOW[(d.getDay()+6)%7]}<br>${fmtMD(d)}</th>`).join('')+'</tr>';
  rooms.forEach(r=>{
    h+=`<tr><td class="roomname">${esc(r.name)}${r.capacity?`<br><span style="color:var(--text-dim);font-weight:400">${esc(r.capacity)} 人</span>`:''}</td>`;
    days.forEach(d=>{
      const dateStr=isoDate(d);
      const items=weekBookings.filter(b=>b.room_id===r.room_id&&b.booking_date===dateStr).sort((a,b)=>a.start_time.localeCompare(b.start_time));
      const pills=items.map(b=>{
        const mine=currentUser&&b.user_id===currentUser.user_id;
        const future=bookingEndDate(b)>new Date();
        const canCancel=mine&&b.status==='booked';
        const canRequest=!mine&&b.status==='booked'&&future;
        const actions=canCancel
          ? '<span class="bk-cancel-hint">點擊圖卡取消預約</span>'
          : (canRequest?`<span class="bk-actions"><button class="bk-action" onclick="openChangeRequestModal('${b.booking_id}')">申請變更</button></span>`:'');
        const interaction=canCancel
          ? ` role="button" tabindex="0" title="點擊取消此預約" onclick="cancelBooking('${b.booking_id}')" onkeydown="handleOwnBookingCardKeydown(event,'${b.booking_id}')"`
          : '';
        return `<div class="bk-pill${mine?' mine':''}${canCancel?' can-cancel':''}"${interaction}><span class="bk-line">${esc(b.start_time.slice(0,5))}-${esc(b.end_time.slice(0,5))}</span><span class="bk-line person">${esc(profileLabel(b.user_id))}</span><span class="bk-line meeting">${esc(b.purpose||'未填會議名稱')}</span>${actions}</div>`;
      }).join('');
      const weekend=d.getDay()===0||d.getDay()===6;
      const pastDate=dateStr<todayISO();
      h+=`<td class="${weekend?'weekend':''}"><div class="daycell">${pills}${pastDate?'<button class="add-cell" disabled>日期已過</button>':`<button class="add-cell" onclick="openBookingModal('${r.room_id}','${dateStr}')">+ 預約</button>`}</div></td>`;
    });
    h+='</tr>';
  });
  h+='</table>';
  box.innerHTML=h;
}

function toggleRecurringOptions(runAudit=true){
  const repeat=document.getElementById('bkRepeatWeekly').checked;

let _conflictTimer=null;
function checkConflictSoon(){clearTimeout(_conflictTimer);_conflictTimer=setTimeout(checkConflictNow,250);}
async function findConflict(roomId,dateStr,start,end,excludeId){
  if(!roomId||!dateStr||!start||!end||end<=start)return null;
  const {data,error}=await db.from('meeting_bookings').select('booking_id,booking_no,room_id,booking_date,start_time,end_time,purpose,user_id,status')
    .eq('room_id',roomId).eq('booking_date',dateStr).in('status',['booked','checked_in']);
  if(error)throw error;
  return (data||[]).filter(b=>b.booking_id!==excludeId).find(b=>start<b.end_time.slice(0,5)&&end>b.start_time.slice(0,5))||null;
}
async function findSeriesConflict(roomId,dates,start,end){
  if(!roomId||!dates.length||!start||!end||end<=start)return null;
  const {data,error}=await db.from('meeting_bookings').select('booking_id,booking_no,room_id,booking_date,start_time,end_time,purpose,user_id,status')
    .eq('room_id',roomId).in('booking_date',dates).in('status',['booked','checked_in']);
  if(error)throw error;
  return (data||[]).find(b=>start<b.end_time.slice(0,5)&&end>b.start_time.slice(0,5))||null;
}
async function checkConflictNow(){
  const roomId=document.getElementById('bkRoom').value;
  const dateStr=document.getElementById('bkDate').value;
  const start=selectedTime('Start');
  const end=selectedTime('End');
  const alertEl=document.getElementById('conflictAlert');
  try{
    if(!dateStr||!start||!end){activeConflict=null;alertEl.innerHTML='';alertEl.classList.remove('show');return;}
    if(isPastBookingSlot(dateStr,start)){
      activeConflict=null;
      alertEl.textContent='不能預約：開始時間已經過去，請選擇目前時間之後的時段。';
      alertEl.classList.add('show');
      return;
    }
    const repeatWeekly=document.getElementById('bkRepeatWeekly').checked;
    const repeatUntil=repeatWeekly?document.getElementById('bkRepeatUntil').value:null;
    const dates=recurringDates(dateStr,repeatWeekly,repeatUntil);
    const conflict=await findSeriesConflict(roomId,dates,start,end);
    if(conflict){
      activeConflict={...conflict,room_id:roomId,booking_date:conflict.booking_date};
      await ensureUserProfiles([conflict.user_id]);
      const mine=conflict.user_id===currentUser.user_id;
      const canChange=conflict.status==='booked'&&bookingEndDate(activeConflict)>new Date();
      alertEl.innerHTML=`<div>不能預約：${repeatWeekly?`週期中的 ${esc(conflict.booking_date)} `:''}此時段已有預約。已預約單號：${esc(conflict.booking_no||'舊資料未編號')}（${esc(conflict.start_time.slice(0,5))}–${esc(conflict.end_time.slice(0,5))}，${esc(profileLabel(conflict.user_id))}，${esc(conflict.purpose||'未填會議名稱')}）。</div>`+
        (canChange?`<button class="btn" type="button" onclick="${mine?`cancelBooking('${conflict.booking_id}')`:`openChangeRequestModal('${conflict.booking_id}',true)`}">${mine?'取消我的原預約':'提出變更申請'}</button>`:'');
      alertEl.classList.add('show');
    }else{
      activeConflict=null;
      alertEl.innerHTML='';
      alertEl.classList.remove('show');
    }
  }catch(e){activeConflict=null;alertEl.textContent=e.message||'時段稽核失敗';alertEl.classList.add('show');}
}

async function saveBookingUnsafe(){
  const roomId=document.getElementById('bkRoom').value;
  const dateStr=document.getElementById('bkDate').value;
  const start=selectedTime('Start');
  const end=selectedTime('End');
  const purpose=document.getElementById('bkPurpose').value.trim();
  const systemPhone=document.getElementById('bkSystemPhone').value.trim();
  const contactPhone=document.getElementById('bkContactPhone').value.trim();
  const repeatWeekly=document.getElementById('bkRepeatWeekly').checked;
  const repeatUntil=repeatWeekly?document.getElementById('bkRepeatUntil').value:null;
  const msg=document.getElementById('bkMsg');
  msg.textContent='';
  if(!roomId||!dateStr||!start||!end){msg.textContent='請填寫完整的會議室、日期與時段';return;}
  if(end<=start){msg.textContent='結束時間必須晚於開始時間';return;}
  if(isPastBookingSlot(dateStr,start)){msg.textContent='開始時間已經過去，不能預約過去時段';return;}
  if(!purpose){msg.textContent='請填寫會議名稱';return;}
  if(!systemPhone&&!contactPhone){msg.textContent='系統未登記電話，聯繫電話為必填';return;}
  if(contactPhone&&contactPhone.replace(/[^0-9#*]/g,'').length<4){msg.textContent='聯繫電話請至少填寫 4 碼的電話或分機';return;}
  let dates;
  try{dates=recurringDates(dateStr,repeatWeekly,repeatUntil);}catch(e){msg.textContent=e.message;return;}
  document.getElementById('bkSaveBtn').disabled=true;
  try{
    const conflict=await findSeriesConflict(roomId,dates,start,end);
    if(conflict){msg.textContent=`不能預約，${repeatWeekly?`${conflict.booking_date} `:''}已預約單號：${conflict.booking_no||'舊資料未編號'}`;await checkConflictNow();return;}
    const {data,error}=await db.rpc('create_meeting_booking_series',{
      p_room_id:roomId,p_purpose:purpose,p_booking_date:dateStr,p_start_time:start,p_end_time:end,
      p_booker_phone:systemPhone||null,p_contact_phone:contactPhone||null,
      p_repeat_weekly:repeatWeekly,p_repeat_until:repeatUntil
    });
    if(error)throw error;
    const count=Number(data?.count||dates.length||1);
    toast(repeatWeekly?`週期預約成功，共建立 ${count} 筆`:'預約成功');
    closeModal('bookingModal');
    await loadWeek();await loadMyBookings();await loadChangeRequests();
  }catch(e){
    if(String(e.message||e).includes('meeting_bookings_no_overlap')||String(e.message||e).includes('exclusion')){
      try{
        const conflict=await findSeriesConflict(roomId,dates,start,end);
        msg.textContent=`不能預約，${repeatWeekly&&conflict?`${conflict.booking_date} `:''}已預約單號：${conflict?.booking_no||'舊資料未編號'}`;
      }catch(_){msg.textContent=translateError(e.message||String(e));}
    }else msg.textContent=translateError(e.message||String(e));
  }finally{
    document.getElementById('bkSaveBtn').disabled=false;
  }
}

async function loadMyBookings(){
  const {data,error}=await db.from('meeting_bookings').select('*,meeting_rooms(name)').eq('user_id',currentUser.user_id)
    .order('booking_date',{ascending:false}).order('start_time',{ascending:false}).limit(50);

  if(!myBookings.length){box.innerHTML='<div class="empty">尚無預約紀錄</div>';return;}
  const STATUS_LABEL={booked:['待報到','warn'],checked_in:['已報到','ok'],cancelled:['已取消',''],expired:['已逾時取消','bad']};
  const now=new Date();
  box.innerHTML=`<table class="mytable"><tr><th>預約單號</th><th>日期</th><th>預約時間</th><th>會議室</th><th>會議名稱</th><th>聯繫電話</th><th>狀態</th><th>操作</th></tr>`+
    myBookings.map(b=>{
      const [label,cls]=STATUS_LABEL[b.status]||[b.status,''];
      const startDt=new Date(`${b.booking_date}T${b.start_time}`);
      const endDt=new Date(`${b.booking_date}T${b.end_time}`);
      const canCheckIn=b.status==='booked'&&now>=startDt&&now<=endDt;
      const canCancel=b.status==='booked'&&now<endDt;
      return `<tr><td>${esc(b.booking_no||'—')}</td><td>${esc(b.booking_date)}</td><td>${esc(b.start_time.slice(0,5))}-${esc(b.end_time.slice(0,5))}</td><td>${esc(b.meeting_rooms?.name||'—')}</td><td>${esc(b.purpose||'—')}</td><td>${esc(b.contact_phone||b.booker_phone||'—')}</td>`+
        `<td><span class="pill ${cls}">${esc(label)}</span></td>`+
        `<td>${canCheckIn?`<button class="act" onclick="checkIn('${b.booking_id}')">✓ 報到</button>`:''}${canCancel?`<button class="act" onclick="cancelBooking('${b.booking_id}')">取消</button>`:''}${!canCheckIn&&!canCancel?'—':''}</td></tr>`;
    }).join('')+'</table>';
}

  await writeAudit('meeting_bookings',bookingId,'update',{status:before?.status},{status:'checked_in'});

}

async function submitChangeRequestUnsafe(){
  const meetingName=document.getElementById('crMeetingName').value.trim();
  const contactPhone=document.getElementById('crContactPhone').value.trim();
  const reason=document.getElementById('crReason').value.trim();
  const msg=document.getElementById('crMsg');

  if(!contactPhone||contactPhone.replace(/[^0-9#*]/g,'').length<4){msg.textContent='請填寫至少 4 碼的聯繫電話或分機';return;}
  const btn=document.getElementById('crSaveBtn');btn.disabled=true;
  try{
    const {error}=await db.rpc('create_meeting_booking_change_request',{
      p_target_booking_id:changeTargetBookingId,p_meeting_name:meetingName,p_contact_phone:contactPhone,p_reason:reason||null
    });
    if(error)throw error;
    closeModal('changeRequestModal');
    toast('變更申請已送出，等待原申請人同意');
    await loadChangeRequests();
  }catch(e){msg.textContent=translateError(e.message||String(e));}
  finally{btn.disabled=false;}
}

async function loadChangeRequests(){
  const box=document.getElementById('requestBox');
  const {data:ownBookingRows,error:ownError}=await db.from('meeting_bookings').select('booking_id').eq('user_id',currentUser.user_id);
  if(ownError){box.innerHTML='讀取變更申請失敗：'+esc(translateError(ownError.message));return;}
  const ownIds=(ownBookingRows||[]).map(b=>b.booking_id);
  const outgoingResult=await db.from('meeting_booking_change_requests').select('*').eq('requester_id',currentUser.user_id).order('created_at',{ascending:false});
  let incoming=[];
  if(ownIds.length){
    const incomingResult=await db.from('meeting_booking_change_requests').select('*').in('target_booking_id',ownIds).order('created_at',{ascending:false});
    if(incomingResult.error){box.innerHTML='讀取變更申請失敗：'+esc(translateError(incomingResult.error.message));return;}
    incoming=incomingResult.data||[];
  }
  if(outgoingResult.error){box.innerHTML='讀取變更申請失敗：'+esc(translateError(outgoingResult.error.message));return;}
  const merged=new Map();[...incoming,...(outgoingResult.data||[])].forEach(r=>merged.set(r.request_id,r));
  changeRequests=[...merged.values()];
  const targetIds=[...new Set(changeRequests.map(r=>r.target_booking_id).filter(Boolean))];
  changeRequestBookings.clear();
  if(targetIds.length){
    const {data,error}=await db.from('meeting_bookings').select('*,meeting_rooms(name)').in('booking_id',targetIds);
    if(!error)(data||[]).forEach(b=>changeRequestBookings.set(b.booking_id,b));
  }
  await ensureUserProfiles(changeRequests.map(r=>r.requester_id).concat([...changeRequestBookings.values()].map(b=>b.user_id)));
  renderChangeRequests(incoming,outgoingResult.data||[]);
}

function requestStatus(status){
  return {pending:['待原申請人審核','warn'],approved:['已同意並完成換單','ok'],rejected:['不同意','bad'],cancelled:['已取消','']}[status]||[status,''];
}
function requestTargetText(r){
  const b=changeRequestBookings.get(r.target_booking_id);
  if(!b)return '原預約資料讀取失敗';
  return `${b.booking_no||'未編號'}｜${b.booking_date} ${b.start_time.slice(0,5)}-${b.end_time.slice(0,5)}｜${b.meeting_rooms?.name||'會議室未設定'}`;
}
async function submitChangeRequest(){if(!beginSystemAction('meeting.submitChangeRequest'))return;try{return await submitChangeRequestUnsafe();}finally{endSystemAction('meeting.submitChangeRequest');}}

function renderChangeRequests(incoming,outgoing){
  const box=document.getElementById('requestBox');
  const incomingHtml=incoming.length?incoming.map(r=>{
    const [label,cls]=requestStatus(r.status);
    return `<div class="request-card"><strong>${esc(profileLabel(r.requester_id))}</strong> 申請承接<br><span class="muted">${esc(requestTargetText(r))}</span><br>會議名稱：${esc(r.requested_meeting_name||'—')}<br>聯繫電話：${esc(r.contact_phone||'—')}${r.reason?`<br>原因：${esc(r.reason)}`:''}<br><span class="pill ${cls}">${esc(label)}</span>${r.response_note?` <span class="muted">${esc(r.response_note)}</span>`:''}`+
      (r.status==='pending'?`<div class="actions"><button class="btn btn-green" onclick="respondChangeRequest('${r.request_id}',true)">同意</button><button class="btn btn-red" onclick="respondChangeRequest('${r.request_id}',false)">不同意</button></div>`:'')+`</div>`;
  }).join(''):'<div class="empty">目前沒有收到變更申請</div>';
  const outgoingHtml=outgoing.length?outgoing.map(r=>{
    const [label,cls]=requestStatus(r.status);
    return `<div class="request-card"><strong>${esc(requestTargetText(r))}</strong><br>申請會議：${esc(r.requested_meeting_name||'—')}<br><span class="pill ${cls}">${esc(label)}</span>${r.response_note?` <span class="muted">${esc(r.response_note)}</span>`:''}${r.status==='approved'&&r.created_booking_id?'<br><span class="muted">新預約已建立，可至「我的預約」查看。</span>':''}</div>`;
  }).join(''):'<div class="empty">目前沒有送出的變更申請</div>';
  box.className='';
  box.innerHTML=`<div class="request-columns"><div><div class="request-title">收到的申請</div>${incomingHtml}</div><div><div class="request-title">我送出的申請</div>${outgoingHtml}</div></div>`;
}

async function respondChangeRequest(requestId,approve){
  if(!confirm(approve?'同意後系統會取消你的原預約，並立即替申請者建立新預約。確定同意？':'確定不同意這筆變更申請？'))return;
  try{
    const {data,error}=await db.rpc('respond_meeting_booking_change_request',{p_request_id:requestId,p_approve:approve});
    if(error)throw error;
    toast(approve?`已同意，新預約單號：${data?.booking_no||'已建立'}`:'已回覆不同意');
    await loadWeek();await loadMyBookings();await loadChangeRequests();
  }catch(e){toast('處理失敗：'+translateError(e.message||String(e)),true);}
}

// ── 會議室管理（管理者） ──────────────────────────────────
function openRoomAdminModal(){
  if(!isAdmin())return;
  resetRoomForm();
  renderRoomList();
  openModal('roomAdminModal');
}
function renderRoomList(){
  const box=document.getElementById('roomListBox');
  if(!allRooms.length){box.innerHTML='<div class="empty">尚未建立會議室，請在上方新增。</div>';return;}
  box.innerHTML=`<table class="mytable"><tr><th>名稱</th><th>可容納人數</th><th>樓層</th><th>狀態</th><th>操作</th></tr>`+
    allRooms.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.capacity??'—')}</td><td>${esc(r.floor||'—')}</td>`+
      `<td><span class="pill ${r.status==='active'?'ok':'bad'}">${r.status==='active'?'啟用':'停用'}</span></td>`+
      `<td><button class="act" onclick="editRoom('${r.room_id}')">編輯</button></td></tr>`).join('')+'</table>';
}
function resetRoomForm(){
  editingRoomId=null;
  document.getElementById('rmName').value='';
  document.getElementById('rmCapacity').value='';
  document.getElementById('rmFloor').value='';
  document.getElementById('rmStatus').value='active';
  document.getElementById('rmNote').value='';
  document.getElementById('rmSaveBtn').textContent='+ 新增會議室';
  document.getElementById('rmCancelEditBtn').style.display='none';
}
function editRoom(roomId){
  const r=allRooms.find(x=>x.room_id===roomId);
  if(!r)return;
  editingRoomId=roomId;
  document.getElementById('rmName').value=r.name||'';
  document.getElementById('rmCapacity').value=r.capacity??'';
  document.getElementById('rmFloor').value=r.floor||'';
  document.getElementById('rmStatus').value=r.status;
  document.getElementById('rmNote').value=r.note||'';
  document.getElementById('rmSaveBtn').textContent='儲存修改';
  document.getElementById('rmCancelEditBtn').style.display='inline-flex';
}
async function saveRoomUnsafe(){
  if(!isAdmin())return;
  const name=document.getElementById('rmName').value.trim();
  if(!name){toast('請輸入會議室名稱',true);return;}
  const payload={
    name,
    capacity:document.getElementById('rmCapacity').value?Number(document.getElementById('rmCapacity').value):null,
    floor:document.getElementById('rmFloor').value.trim()||null,
    status:document.getElementById('rmStatus').value,
    note:document.getElementById('rmNote').value.trim()||null
  };
  try{
    if(editingRoomId){
      const before=allRooms.find(r=>r.room_id===editingRoomId);
      const {error}=await db.from('meeting_rooms').update(payload).eq('room_id',editingRoomId);
      if(error)throw error;
      await writeAudit('meeting_rooms',editingRoomId,'update',before,payload);
      toast('已更新會議室');
    }else{
      payload.created_by=currentUser.user_id;
      const {data,error}=await db.from('meeting_rooms').insert(payload).select().single();
      if(error)throw error;
      await writeAudit('meeting_rooms',data.room_id,'insert',null,payload);
      toast('已新增會議室');
    }
    await loadRooms();
    resetRoomForm();
    renderRoomList();
    renderGrid();
  }catch(e){
    toast('儲存失敗：'+translateError(e.message||String(e)),true);
  }
}
async function saveRoom(){if(!beginSystemAction('meeting.saveRoom'))return;try{return await saveRoomUnsafe();}finally{endSystemAction('meeting.saveRoom');}}
</script>
