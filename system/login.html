/* 子畫面：放在 .overlay 裡，沿用忘記密碼那組 modal 樣式 */
/* 展開安裝步驟後在矮螢幕（例如手機橫放）會超出視窗，所以卡片自己要能捲 */

.install-btn.alt:hover{background:rgba(255,255,255,.05)}

<script>
const db = createDb();

// 確認非互動高頻讀取觸發安全斷線後，在登入頁保留明確原因。
(() => {
  const params = new URLSearchParams(window.location.search);
  if (params.get('security') !== 'bulk-read') return;
  const fallback = '系統確認目前工作階段出現非互動高頻資料存取，已中止目前連線並通知系統管理員。';
  let message = fallback;
  try {
    message = sessionStorage.getItem('securityLogoutMessage') || fallback;
    sessionStorage.removeItem('securityLogoutMessage');
  } catch (e) {}
  document.getElementById('errMsg').textContent = message;
  params.delete('security');
  const query = params.toString();
  history.replaceState(null, '', window.location.pathname + (query ? `?${query}` : '') + window.location.hash);
})();

const ROLE_ROUTES = {
  admin:       'admin.html',
  supervisor:  'admin.html',
  inspector:   'guardpatrol.html',
  maintenance: 'workorder.html?v=reporter-20260701',
};
const RBAC_ROLES = {
  reporter:'一般報修人員',
  duty:'值班人員',
  dispatcher:'派工管理員',
  technician:'維修技術人員',
  unit_supervisor:'單位主管',
  mgmt_supervisor:'管理部主管',
  sysadmin:'系統管理員'
};
const LEGACY_TO_RBAC = { admin:'sysadmin', supervisor:'unit_supervisor', maintenance:'technician', inspector:'reporter' };
const ROLE_PERMISSION_PRESETS = {
  reporter:{ maintenance:true, repair:true, read:true, create:true },
  duty:{ maintenance:true, handover:true, repair:true, read:true, create:true, dispatch:true },
  dispatcher:{ maintenance:true, repair:true, read:true, create:true, update:true, dispatch:true, export:true },
  technician:{ maintenance:true, read:true, update:true, dispatch:true },
  unit_supervisor:{ maintenance:true, handover:true, repair:true, read:true, create:true, dispatch:true, close:true, sign:true, export:true },
  mgmt_supervisor:{ maintenance:true, handover:true, read:true, close:true, sign:true, export:true },
  sysadmin:{ inspector:true, maintenance:true, handover:true, repair:true, read:true, create:true, update:true, delete:true, dispatch:true, close:true, sign:true, export:true, admin:true }
};

function normalizeRoleId(profile) {
  const role = profile?.rbac_role || profile?.role;
  if (RBAC_ROLES[role]) return role;
  return LEGACY_TO_RBAC[role] || 'reporter';
}

function hasPermission(profile, key) {
  const p = profile.permissions || {};
  if (typeof p[key] === 'boolean') return p[key];
  return ROLE_PERMISSION_PRESETS[normalizeRoleId(profile)]?.[key] === true;
}

function safeRedirect(target) {
  if (!target) return null;
  if (/^app\.html(?:\?.*)?$/.test(target)) return 'inspection-archived.html';
  if (/^[A-Za-z0-9_\-]+\.html(?:\?[A-Za-z0-9_\-=&%.]*)?(?:#[A-Za-z0-9_\-]+)?$/.test(target)) return target;
  return null;
}
function getRedirectTarget(profile) {
  const requested = safeRedirect(new URLSearchParams(window.location.search).get('redirect'));
  return requested || 'index.html';
}
function getLoginRoute(profile) {
  if (!profile.rbac_role) {
    const p = profile.permissions || {};
    if (profile.role === 'admin' || profile.role === 'supervisor') return 'admin.html';
    if (profile.role === 'inspector') {
      if (p.inspector !== false) return 'guardpatrol.html';
      if (p.handover !== false) return 'handover.html';
      if (p.maintenance !== false) return 'workorder.html?v=reporter-20260701';
      return 'guardpatrol.html';
    }
    if (profile.role === 'maintenance') {
      if (p.maintenance !== false) return 'workorder.html?v=reporter-20260701';
      if (p.inspector !== false) return 'guardpatrol.html';
      if (p.handover !== false) return 'handover.html';
      return 'workorder.html?v=reporter-20260701';
    }
    return ROLE_ROUTES[profile.role] || 'guardpatrol.html';
  }

  const roleId = normalizeRoleId(profile);
  if (roleId === 'sysadmin' || hasPermission(profile, 'admin')) return 'admin.html';
  if (roleId === 'unit_supervisor' || roleId === 'mgmt_supervisor') return 'admin.html';
  if (hasPermission(profile, 'maintenance') || hasPermission(profile, 'dispatch') || hasPermission(profile, 'update') || hasPermission(profile, 'create') || hasPermission(profile, 'repair')) return 'workorder.html?v=reporter-20260701';
  if (hasPermission(profile, 'handover')) return 'handover.html';
  if (hasPermission(profile, 'inspector')) return 'guardpatrol.html';
  return ROLE_ROUTES[profile.role] || 'workorder.html?v=reporter-20260701';
}

// 記錄登入/登出事件到系統紀錄；IP 應由受控後端依請求取得，
// 前端不可把使用者 IP 傳送給未列入系統契約的第三方服務。
async function logAuthEvent(action, profile) {
  try {
    if (window.SystemAudit?.record) {
      return await window.SystemAudit.record(action, {
        feature: action === 'login' ? '登入系統' : '登出系統',
        result: '成功',
        login_method: document.getElementById('username').value.includes('@') ? 'email' : 'username'
      });
    }
    await db.from('audit_logs').insert({
      table_name: 'auth', record_id: String(profile.user_id), action,
      changes: {
        event_type: action,
        actor: { user_id: profile.user_id, username: profile.username, email: profile.email, name: profile.name, role: profile.role, rbac_role: profile.rbac_role, department: profile.department },
        details: { result: '成功', login_method: document.getElementById('username').value.includes('@') ? 'email' : 'username' }
      },
      operator_id: profile.user_id,
      ip_address: null, user_agent: navigator.userAgent
    });
    return true;
  } catch (e) { return false; }
}

function translateError(msg) {
  if (!msg) return '未知錯誤';
  if (msg.includes('User already registered')) return '此 Email 已被註冊';
  if (msg.includes('Invalid login credentials')) return '帳號或密碼錯誤';
  if (msg.includes('Email not confirmed')) return 'Email 尚未驗證，請檢查信箱';
  if (msg.includes('New password should be different')) return '新密碼不能與舊密碼相同';
  if (msg.includes('Password should be at least')) return '密碼長度不足，請輸入更長的密碼';
  if (msg.includes('Signup requires a valid password')) return '請輸入有效密碼';
  if (msg.includes('For security purposes') && msg.includes('second')) return '操作過於頻繁，請稍後再試';
  if (msg.includes('Email link is invalid or has expired') || msg.includes('otp_expired')) return '連結已失效或過期，請重新申請';
  if (msg.includes('invalid format')) return 'Email 格式不正確';
  if (msg.includes('duplicate key value')) return '資料重複，請確認是否已存在';
  if (msg.includes('null value in column')) return '必填欄位不可空白';
  if (msg.includes('violates foreign key constraint')) return '關聯資料錯誤，無法刪除';
  if (msg.includes('violates row-level security')) return '無操作權限';
  if (msg.includes('permission denied')) return '無操作權限';
  if (msg.includes('JWT expired')) return '登入已過期，請重新整理頁面';
  if (msg.includes('relation') && msg.includes('does not exist')) return '資料表不存在，請確認資料庫設定';
  if (msg.includes('value too long')) return '輸入值過長';
  if (msg.includes('invalid input syntax')) return '輸入格式不正確';
  if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) return '網路連線失敗，請稍後再試';
  return '操作失敗，請稍後再試或聯絡系統管理員';
}

let captchaChallengeId = '';
let captchaLoading = false;

async function edgeFunctionMessage(error, data, fallback) {
  if (data?.message) return data.message;
  const response = error?.context;
  if (response && typeof response.clone === 'function') {
    try {
      const payload = await response.clone().json();
      if (payload?.message) return payload.message;
    } catch (_) {}
  }
  return fallback;
}

async function loadCaptcha() {
  if (captchaLoading) return;
  captchaLoading = true;
  captchaChallengeId = '';
  const image = document.getElementById('captchaImage');
  const answer = document.getElementById('captchaAnswer');
  const refresh = document.getElementById('captchaRefreshBtn');
  const status = document.getElementById('captchaStatus');
  refresh.disabled = true;
  image.removeAttribute('src');
  answer.value = '';
  status.textContent = '驗證碼載入中…';

  const { data, error } = await db.functions.invoke('username-login', {
    body: { action: 'captcha' }
  });
  if (error || !data?.challenge_id || !data?.image) {
    status.textContent = await edgeFunctionMessage(error, data, '驗證碼載入失敗，請重新產生');
    captchaLoading = false;
    refresh.disabled = false;
    return;
  }

  captchaChallengeId = data.challenge_id;
  image.src = data.image;
  status.textContent = '5 分鐘內有效，送出後即失效';
  captchaLoading = false;
  refresh.disabled = false;
}
// ── Handle password-reset link (#type=recovery / #error=...) ──────────────────
(async () => {
  const hash = window.location.hash;
  if (hash.includes('type=recovery')) {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('resetOverlay').classList.add('show');
    return;
  }
  if (hash.includes('error=')) {
    const params = new URLSearchParams(hash.replace(/^#/, ''));
    const desc = params.get('error_description') || params.get('error_code') || params.get('error') || '';
    document.getElementById('errMsg').textContent = translateError(desc.replace(/\+/g, ' '));
    window.location.hash = '';
    await loadCaptcha();
    return;
  }

  // Already logged in?
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    const { data: profile } = await db.from('users').select('role,rbac_role,permissions').eq('auth_id', session.user.id).single();
    if (profile) { window.location.href = getRedirectTarget(profile); return; }
  }
  await loadCaptcha();
})();

// ── Login ─────────────────────────────────────────────────────────────────────
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('captchaRefreshBtn').addEventListener('click', loadCaptcha);
document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('captchaAnswer').focus(); });
document.getElementById('captchaAnswer').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
document.getElementById('captchaAnswer').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const identifier = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const captchaAnswer = document.getElementById('captchaAnswer').value.trim();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errMsg');
  err.textContent = '';
  if (!identifier || !password) { err.textContent = '請填寫帳號與密碼'; return; }
  if (!captchaChallengeId || !/^\d{6}$/.test(captchaAnswer)) {
    err.textContent = captchaChallengeId ? '請輸入圖中的六位數字驗證碼' : '驗證碼尚未載入，請重新產生';
    return;
  }
  btn.disabled = true; btn.textContent = '登入中…';

  // 帳號與 Email 統一交由伺服器驗證。伺服器會記錄每一次成功、失敗或被阻擋的
  // 登入嘗試，並由請求本身取得來源網路位址與瀏覽器資訊。
  const { data: loginResult, error: loginError } = await db.functions.invoke('username-login', {
    body: {
      identifier,
      password,
      captcha_id: captchaChallengeId,
      captcha_answer: captchaAnswer
    }
  });
  if (loginError || !loginResult?.access_token || !loginResult?.refresh_token) {
    err.textContent = await edgeFunctionMessage(loginError, loginResult, '帳號、密碼或驗證碼錯誤');
    await loadCaptcha();
    btn.disabled = false; btn.textContent = '登入';
    return;
  }
  const setResult = await db.auth.setSession({
    access_token: loginResult.access_token,
    refresh_token: loginResult.refresh_token
  });
  if (setResult.error) {
    err.textContent = '登入狀態建立失敗，請稍後重試';
    await loadCaptcha();
    btn.disabled = false; btn.textContent = '登入';
    return;
  }
  const sessionUser = setResult.data?.user;

  if (!sessionUser) {
    err.textContent = '登入狀態建立失敗，請稍後重試';
    await loadCaptcha();
    btn.disabled = false; btn.textContent = '登入';
    return;
  }

  const { data: profile } = await db.from('users').select('user_id,username,email,role,rbac_role,name,phone,permissions,dept_id,department').eq('auth_id', sessionUser?.id).single();
  if (!profile) {
    err.textContent = '找不到使用者資料，請聯絡管理員';
    await db.auth.signOut();
    await loadCaptcha();
    btn.disabled = false; btn.textContent = '登入';
    return;
  }

  if (window.SystemUserProfile) window.SystemUserProfile.save(profile);
  else {
    sessionStorage.setItem('user_role', profile.role);
    sessionStorage.setItem('user_rbac_role', profile.rbac_role || '');
    sessionStorage.setItem('user_name', profile.name);
    if (profile.username) sessionStorage.setItem('user_username', profile.username);
    if (profile.user_id) sessionStorage.setItem('user_id', profile.user_id);
    if (profile.dept_id) sessionStorage.setItem('user_dept_id', profile.dept_id);
    if (profile.department) sessionStorage.setItem('user_department', profile.department);
    if (profile.phone) sessionStorage.setItem('user_phone', profile.phone);
  }
  // 登入嘗試已由伺服器在發出登入憑證前完成稽核，避免切頁造成漏記或重複紀錄。
  window.location.href = getRedirectTarget(profile);
}

// ── 忘記密碼 ──────────────────────────────────────────────────────────────────
document.getElementById('forgotLink').addEventListener('click', () => {
  document.getElementById('forgotEmail').value = '';
  document.getElementById('forgotErr').textContent = '';
  document.getElementById('forgotOk').textContent = '';
  document.getElementById('forgotOverlay').classList.add('show');
});

document.getElementById('forgotBackBtn').addEventListener('click', () => {
  document.getElementById('forgotOverlay').classList.remove('show');
});

document.getElementById('forgotSendBtn').addEventListener('click', async () => {
  const email = document.getElementById('forgotEmail').value.trim();
  const btn = document.getElementById('forgotSendBtn');
  const err = document.getElementById('forgotErr');
  const ok  = document.getElementById('forgotOk');
  err.textContent = ''; ok.textContent = '';
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    err.textContent = '請輸入有效的 Email 地址'; return;
  }
  btn.disabled = true; btn.textContent = '寄送中…';
  const redirectTo = window.location.origin + window.location.pathname;
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo });
  btn.disabled = false; btn.textContent = '寄送重設連結';
  if (error) {
    err.textContent = '寄送失敗：' + translateError(error.message);
  } else {
    ok.textContent = '重設連結已寄出，請檢查您的信箱（含垃圾郵件）';
    btn.disabled = true;
  }
});

// ── 設定新密碼 ────────────────────────────────────────────────────────────────
document.getElementById('resetSaveBtn').addEventListener('click', async () => {
  const pw  = document.getElementById('resetPw').value;
  const pw2 = document.getElementById('resetPw2').value;
  const btn = document.getElementById('resetSaveBtn');
  const err = document.getElementById('resetErr');
  const ok  = document.getElementById('resetOk');
  err.textContent = ''; ok.textContent = '';
  if (pw.length < 8) { err.textContent = '密碼至少需要 8 個字元'; return; }
  if (pw !== pw2) { err.textContent = '兩次密碼不一致'; return; }
  btn.disabled = true; btn.textContent = '儲存中…';
  const { error } = await db.auth.updateUser({ password: pw });
  btn.disabled = false; btn.textContent = '設定新密碼';
  if (error) {
    err.textContent = '設定失敗：' + translateError(error.message);
  } else {
    ok.textContent = '密碼已更新！即將跳轉至登入頁面…';
    setTimeout(() => {
      window.location.hash = '';
      window.location.reload();
    }, 2000);
  }
});
</script>

<script>
// ── 手機／平板桌面捷徑安裝 ─────────────────────────────────────────────────
// 登入卡下方放一顆「APP捷徑下載」，點了才開子畫面（沿用忘記密碼那組 overlay）。
// iOS：下載 Web Clip 描述檔（.mobileconfig），安裝後主畫面出現圖示。
// Android：走 PWA，用 beforeinstallprompt 一鍵加入主畫面。
// LINE / FB 等 App 內建瀏覽器都裝不了，一律導引到系統瀏覽器。
(function () {
  const PROFILE_URL = 'beinong-patrol.mobileconfig?v=20260807-1';
  const INSTALL_STATE_KEY = 'beinong_app_shortcut_installed_v1';
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);

  function markShortcutInstalled() {
    try { localStorage.setItem(INSTALL_STATE_KEY, '1'); } catch (e) { /* 私密瀏覽可能停用儲存 */ }
  }
  function shortcutKnownInstalled() {
    try { return localStorage.getItem(INSTALL_STATE_KEY) === '1'; } catch (e) { return false; }
  }

  const openedFromShortcut = new URLSearchParams(window.location.search).get('appShortcut') === '1';
  if (openedFromShortcut) {
    markShortcutInstalled();
    try {
      const cleanUrl = new URL(window.location.href);
      cleanUrl.searchParams.delete('appShortcut');
      window.history.replaceState(null, '', cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
    } catch (e) { /* 保留原網址不影響使用 */ }
  }

  if (!isIOS && !isAndroid) return;               // 桌機不顯示安裝卡

  // 已經從桌面圖示開啟，或本機已記錄完成安裝，就不用再顯示下載入口。
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                     window.navigator.standalone === true;
  if (standalone) { markShortcutInstalled(); return; }
  if (shortcutKnownInstalled()) return;

  const isLine     = /\bLine\//i.test(ua);
  const isOtherApp = /FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|DingTalk|KAKAOTALK/i.test(ua);
  const isIOSAltBrowser = isIOS && /CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
  const blocked = isLine || isOtherApp || isIOSAltBrowser;

  const trigger   = document.getElementById('installTrigger');
  const overlay   = document.getElementById('installOverlay');
  const closeBtn  = document.getElementById('installCloseBtn');
  const desc      = document.getElementById('installDesc');
  const warn      = document.getElementById('installWarn');
  const warnText  = document.getElementById('installWarnText');
  const btn       = document.getElementById('installBtn');
  const btnText   = document.getElementById('installBtnText');
  const stepsList = document.getElementById('installStepsList');
  const note      = document.getElementById('installNote');

  function setSteps(items) {
    stepsList.textContent = '';
    items.forEach(function (t) {
      const li = document.createElement('li');
      li.textContent = t;
      stepsList.appendChild(li);
    });
  }

  function closeOverlay() { overlay.classList.remove('show'); }
  trigger.addEventListener('click', function () { overlay.classList.add('show'); });
  closeBtn.addEventListener('click', closeOverlay);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeOverlay();
  });

  // LINE 支援用 openExternalBrowser=1 直接跳出系統瀏覽器
  function externalBrowserUrl() {
    const u = new URL(window.location.href);
    u.searchParams.set('openExternalBrowser', '1');
    return u.toString();
  }

  // ── 情境一：App 內建瀏覽器（LINE / FB / IG…）或 iOS 上的非 Safari 瀏覽器 ──
  if (blocked) {
    const target = isIOS ? 'Safari' : 'Chrome';
    desc.textContent = '目前的瀏覽器無法安裝桌面圖示。';
    warn.hidden = false;
    warnText.textContent = isLine
      ? '偵測到 LINE 內建瀏覽器，請先切換到 ' + target + ' 才能安裝。'
      : '請先用 ' + target + ' 開啟本頁，才能安裝桌面圖示。';
    btnText.textContent = '用 ' + target + ' 開啟本頁';
    btn.firstElementChild.textContent = '↗';

    if (isLine) {
      btn.addEventListener('click', function () { window.location.href = externalBrowserUrl(); });
    } else if (isIOSAltBrowser) {
      // Chrome for iOS 支援 x-safari- 前綴切換到 Safari
      btn.addEventListener('click', function () {
        window.location.href = 'x-safari-' + window.location.href;
      });
    } else {
      btn.addEventListener('click', function () {
        try { navigator.clipboard.writeText(window.location.href); } catch (e) { /* 忽略 */ }
        warnText.textContent = '網址已複製，請貼到 ' + target + ' 開啟。';
      });
    }

    setSteps(isIOS
      ? ['點右上角「⋯」或分享鈕。', '選「用 Safari 開啟」。', '回到本頁後點「下載並安裝描述檔」。']
      : ['點右上角「⋯」。', '選「用其他瀏覽器開啟」→ Chrome。', '回到本頁後點「加入主畫面」。']);
    note.textContent = '這是網頁捷徑，不是應用程式商店的 App，不會存取裝置上的個人資料。';
    trigger.hidden = false;
    return;
  }

  // ── 情境二：iOS Safari → 下載描述檔 ──────────────────────────────────────
  if (isIOS) {
    desc.textContent = '安裝描述檔後，主畫面會出現「北農巡檢」圖示。';
    btnText.textContent = '下載並安裝描述檔';
    setSteps([
      '點「下載並安裝描述檔」，出現提示時選「允許」。',
      '開啟「設定」App，最上方會出現「已下載描述檔」。',
      '點進去 →「安裝」→ 輸入螢幕鎖定密碼 →「安裝」。',
      '完成後回到主畫面，即可看到「北農巡檢」圖示。'
    ]);
    note.textContent = 'iOS 未簽署的描述檔會顯示「未簽署」提示，屬正常現象。' +
                       '若「設定」裡找不到，請到「一般」→「VPN 與裝置管理」。';

    // 先把描述檔抓進記憶體，點擊時才能在同一個使用者手勢內完成導向。
    // 直接連檔案的話 GitHub Pages 會送出 application/octet-stream，
    // Safari 只會存檔而不會觸發描述檔安裝流程。
    let profileText = null;
    fetch(PROFILE_URL, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (t) { profileText = t; })
      .catch(function () { /* 失敗就走直接下載 */ });

    // 把描述檔裡建置期寫死的網址換成「目前這一頁」的網址，
    // 這樣不論部署在 GitHub Pages、自架網域或區網 IP，裝出來的圖示都指得對。
    function withCurrentUrl(text) {
      const shortcutUrl = new URL('login.html', window.location.href);
      shortcutUrl.searchParams.set('appShortcut', '1');
      const here = shortcutUrl.href
        .replace(/&/g, '&amp;').replace(/</g, '&lt;');
      return text.replace(
        /(<key>URL<\/key>\s*<string>)[^<]*(<\/string>)/,
        function (_m, open, close) { return open + here + close; }
      );
    }

    btn.addEventListener('click', function () {
      markShortcutInstalled();
      trigger.hidden = true;
      closeOverlay();
      if (!profileText) { window.location.href = PROFILE_URL; return; }
      const url = URL.createObjectURL(
        new Blob([withCurrentUrl(profileText)], { type: 'application/x-apple-aspen-config' })
      );
      window.location.href = url;
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    });

    trigger.hidden = false;
    return;
  }

  // ── 情境三：Android → PWA 加入主畫面 ────────────────────────────────────
  desc.textContent = '加入主畫面後，點圖示即可全螢幕開啟巡檢系統。';
  btnText.textContent = '加入主畫面';
  setSteps([
    '點「加入主畫面」。',
    '若沒有跳出視窗，請點瀏覽器右上角「⋮」。',
    '選「加到主畫面」或「安裝應用程式」。',
    '完成後桌面會出現「北農巡檢」圖示。'
  ]);
  note.textContent = '這是網頁捷徑（PWA），不需要經過 Google Play 安裝。';

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
  });
  window.addEventListener('appinstalled', function () { markShortcutInstalled(); trigger.hidden = true; closeOverlay(); });

  btn.addEventListener('click', function () {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function (choice) {
        if (choice && choice.outcome === 'accepted') {
          markShortcutInstalled();
          trigger.hidden = true;
          closeOverlay();
        }
      }).finally(function () { deferredPrompt = null; });
      return;
    }
    // 沒有安裝提示（例如已安裝、或瀏覽器不支援）就展開手動步驟
    document.getElementById('installSteps').open = true;
  });

  // Chrome 要有 Service Worker 才會觸發 beforeinstallprompt；只在 Android 註冊，
  // 避免影響 iOS Safari 的既有行為。
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('patrol-service-worker.js', { scope: './' })
        .catch(function () { /* 註冊失敗就只走手動步驟 */ });
    });
  }

  trigger.hidden = false;
})();
</script>
