:root{--bg:#060b1a;--bg-2:#0d1530;--ink:#e8edf8;--ink-2:#b0bdd4;--ink-3:#6b7d9e;--accent:#00d4ff;--accent-2:#ff4d8c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:48px 20px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto}
.kicker{font-family:monospace;color:var(--accent);letter-spacing:3px;font-size:13px;margin-bottom:14px}
h1{font-size:clamp(28px,5vw,44px);font-weight:900;line-height:1.2}
.sub{color:var(--ink-3);margin-top:16px;font-size:16px}
.cta{display:inline-block;margin-top:28px;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#04101f;font-weight:700;padding:16px 30px;border-radius:12px;text-decoration:none;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px}
a.card{display:block;background:var(--bg-2);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:22px;text-decoration:none;color:var(--ink);transition:.25s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .t{font-weight:700;font-size:17px}
.card .d{color:var(--ink-3);font-size:13px;margin-top:6px}
.tag{display:inline-block;font-family:monospace;font-size:11px;color:var(--accent-2);border:1px solid var(--accent-2);border-radius:6px;padding:2px 8px;margin-bottom:10px}
.note{margin-top:40px;padding:18px 20px;background:rgba(0,212,255,.06);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;font-size:14px;color:var(--ink-2)}
code{font-family:monospace;background:rgba(255,255,255,.08);padding:2px 7px;border-radius:5px;font-size:13px;color:var(--accent)}
footer{margin-top:48px;color:var(--ink-3);font-size:13px;text-align:center}
.system-home{display:inline-block;margin-bottom:24px;color:var(--accent);text-decoration:none;font-size:14px}
.system-home:hover{text-decoration:underline}
</style>
</head>
