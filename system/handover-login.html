<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'self' blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電子交接簿登入</title>
<script src="vendor/supabase-js-2.min.js"></script>
<script src="supabase-config.js?v=20260806-1"></script>
<style>
:root{
  --bg:#eef4fb;
  --panel:#ffffff;
  --line:#cfe0f1;
  --text:#0f2538;
  --muted:#647994;
  --blue:#008fe8;
  --blue-dark:#006fb8;
  --danger:#d92f3b;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  color:var(--text);
  background:
    linear-gradient(180deg,rgba(255,255,255,.76),rgba(238,244,251,.94)),
    radial-gradient(circle at 20% 10%,rgba(0,143,232,.18),transparent 34%),
    var(--bg);
  font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
}
.card{
  width:min(440px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  padding:34px 32px 30px;
  box-shadow:0 18px 48px rgba(31,70,107,.14);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}
.mark{
  width:38px;
  height:38px;
  border-radius:8px;
  display:grid;
  place-items:center;
  color:#fff;
  background:linear-gradient(135deg,var(--blue),#18c9ff);
  font-weight:800;
  letter-spacing:.08em;
}
.eyebrow{
  color:var(--blue);
  font-size:.78rem;
  letter-spacing:.18em;
  text-transform:uppercase;
}
h1{
  margin:4px 0 0;
  font-size:1.75rem;
  letter-spacing:0;
}
.hint{
  margin:0 0 24px;
  color:var(--muted);
  line-height:1.7;
}
label{
  display:block;
  margin:14px 0 7px;
  color:#38536c;
  font-size:.9rem;
  font-weight:700;
}
input{
  width:100%;
  min-height:46px;
  border:1px solid #bfd4e8;
  border-radius:6px;
  padding:0 14px;
  font:inherit;
  color:var(--text);
  background:#f9fcff;
  outline:none;
}
input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(0,143,232,.14);
}
button{
  width:100%;
  min-height:48px;
  margin-top:22px;
  border:0;
  border-radius:6px;
  background:var(--blue);
  color:white;
  font:inherit;
  font-weight:800;
  cursor:pointer;
}
button:hover{background:var(--blue-dark)}
button:disabled{opacity:.64;cursor:wait}
.message{
  min-height:22px;
  margin-top:14px;
  color:var(--danger);
  font-weight:700;
  line-height:1.5;
}
.support{
  margin-top:18px;
  color:var(--muted);
  font-size:.85rem;
  line-height:1.6;
}
@media (max-width:520px){
  body{padding:16px;place-items:start center}
  .card{padding:26px 22px;margin-top:36px}
  h1{font-size:1.55rem}
}
</style>
</head>
<body>
<main class="card" aria-label="電子交接簿登入">
  <div class="brand">
    <div class="mark">交</div>
    <div>
      <div class="eyebrow">Taipei Agricultural Products</div>
      <h1>電子交接簿登入</h1>
    </div>
  </div>
  <p class="hint">登入後只會進入電子交接簿，不顯示其他系統選單。</p>
  <form id="loginForm">
    <label for="username">帳號</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">密碼</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">登入交接簿</button>
    <div id="message" class="message" role="alert"></div>
  </form>
  <div class="support">忘記密碼或無法登入時，請洽系統管理員協助重設。</div>
</main>

<script>
const HANDOVER_TARGET = 'handover.html';
const db = createDb();

const form = document.getElementById('loginForm');
const usernameEl = document.getElementById('username');
const passwordEl = document.getElementById('password');
const buttonEl = document.getElementById('loginBtn');
const messageEl = document.getElementById('message');

function setMessage(text) {
  messageEl.textContent = text || '';
}

// 記錄登入事件與裝置資訊；IP 應由受控後端擷取，失敗不影響登入流程本身
async function logAuthEvent(action, profile) {
  try {
    const { error } = await db.functions.invoke('audit-event', { body: {
      event_type: action,
      event_id: crypto.randomUUID(),
      page: { system:'handover', page:'電子交接簿登入', path:'handover-login.html', url:location.pathname },
      details: { feature:'登入電子交接簿', result:'成功', login_method:'username' }
    }});
    if (!error) return true;
    await db.from('audit_logs').insert({
      table_name: 'auth', record_id: String(profile.user_id), action,
      changes: { event_type: action, actor:profile, details:{ feature:'登入電子交接簿', result:'成功', login_method:'username' } },
      operator_id: profile.user_id,
      ip_address: null, user_agent: navigator.userAgent
    });
    return true;
  } catch (e) { return false; }
}

function setBusy(isBusy) {
  buttonEl.disabled = isBusy;
  buttonEl.textContent = isBusy ? '登入中...' : '登入交接簿';
}

(async function redirectExistingSession() {
  const { data: { session } } = await db.auth.getSession();
  if (session) location.replace(HANDOVER_TARGET);
})();

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  setMessage('');
  const username = usernameEl.value.trim();
  const password = passwordEl.value;
  if (!username || !password) {
    setMessage('請輸入帳號與密碼。');
    return;
  }

  setBusy(true);
  try {
    const { data: loginEmail, error: lookupErr } = await db.rpc('login_lookup_email', { p_username: username });
    if (lookupErr || !loginEmail) throw new Error('帳號不存在或尚未啟用。');

    const { data: signInData, error } = await db.auth.signInWithPassword({ email: loginEmail, password });
    if (error) throw new Error('帳號或密碼錯誤。');

    const { data: profile } = await db.from('users').select('user_id,username,email,name,role,rbac_role,department,dept_id').eq('auth_id', signInData.user.id).single();
    if (profile) await logAuthEvent('login', profile);

    location.href = HANDOVER_TARGET;
  } catch (err) {
    setMessage(err.message || '登入失敗，請稍後再試。');
  } finally {
    setBusy(false);
  }
});
</script>
</body>
</html>
