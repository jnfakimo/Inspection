[functions.ipcam-proxy]
verify_jwt = true

[functions.cwa-weather]
verify_jwt = false

# LINE itself cannot send a Supabase JWT. The function verifies LINE's HMAC
# signature and separately authenticates internal/test requests.
[functions.line-notify]
verify_jwt = false

[functions.username-login]
verify_jwt = false

[functions.audit-event]
verify_jwt = true

[functions.app-api]
verify_jwt = true

[functions.google-calendar]
# The function validates the current user with auth.getUser(). Keep the legacy
# gateway verifier off so tokens signed by the project's current JWT keys work.
verify_jwt = false

# Google OAuth callback does not carry a Supabase JWT. It accepts GET only and
# validates one-time state, PKCE, expiry and browser fingerprint itself.
[functions.google-calendar-callback]
verify_jwt = false

# Scheduled worker accepts only the server-side CRON_SECRET.
[functions.google-calendar-worker]
verify_jwt = false
